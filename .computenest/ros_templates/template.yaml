ROSTemplateFormatVersion: '2015-09-01'
Description:
  en: 'Robot (VLA) data processing solution: ACK managed Pro cluster, GPU node pool, OSS/CPFS storage, Fluid data acceleration, Argo Workflows and KubeRay.'
  zh-cn: '机器人（VLA）数据处理解决方案：ACK 托管 Pro 集群 + GPU 节点池 + OSS/CPFS 存储 + Fluid 数据加速 + Argo Workflows + KubeRay。'

Parameters:
  PayType:
    Type: String
    Label:
      en: ECS Instance Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Description:
      en: When the resource purchase duration is Month, the value of Period ranges from 1 to 9, 12, 24, 36, 48, or 60. <br><b><font color='red'> Valid only when ECS instance types are PrePaid </b></font>
      zh-cn: 当购买资源时长为 Month 时，Period 取值：1~9 <br><b><font color='red'>当 ECS 实例类型为 PrePaid 时有效</b></font>
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  SysNodeInstanceType:
    Type: String
    Label:
      en: Management Node Instance Type
      zh-cn: 管控节点规格
    Description:
      en: Instance type of the management node pool, which hosts control-plane style components (Argo Workflows, KubeRay operator, Fluid, CSI). GPU workloads never run here. Limited to u1 sizes with at least 4 vCPU / 16 GiB (the recommended floor for these components). Default ecs.u1-c1m4.xlarge = 4 vCPU / 16 GiB.
      zh-cn: 管控节点池规格，用于承载 Argo Workflows、KubeRay operator、Fluid、CSI 等组件，不承载 GPU 计算。已限定为满足需求的 u1 规格（≥ 4 vCPU / 16 GiB，这些组件的推荐下限）。默认 ecs.u1-c1m4.xlarge = 4 vCPU / 16 GiB。
    Default: ecs.u1-c1m4.xlarge
    Required: true
    AllowedValues:
      - ecs.u1-c1m4.xlarge
      - ecs.u1-c1m8.xlarge
      - ecs.u1-c1m2.2xlarge
      - ecs.u1-c1m4.2xlarge
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      ZoneId: ${ZoneId}
      CreateACKClusterParams:
        NetworkPlugin: terway-eniip
      ValueLabelMapping:
        ecs.u1-c1m4.xlarge:
          zh-cn: ecs.u1-c1m4.xlarge（4 vCPU / 16 GiB）
          en: ecs.u1-c1m4.xlarge (4 vCPU / 16 GiB)
        ecs.u1-c1m8.xlarge:
          zh-cn: ecs.u1-c1m8.xlarge（4 vCPU / 32 GiB）
          en: ecs.u1-c1m8.xlarge (4 vCPU / 32 GiB)
        ecs.u1-c1m2.2xlarge:
          zh-cn: ecs.u1-c1m2.2xlarge（8 vCPU / 16 GiB）
          en: ecs.u1-c1m2.2xlarge (8 vCPU / 16 GiB)
        ecs.u1-c1m4.2xlarge:
          zh-cn: ecs.u1-c1m4.2xlarge（8 vCPU / 32 GiB）
          en: ecs.u1-c1m4.2xlarge (8 vCPU / 32 GiB)
  SysNodeCount:
    Type: Number
    Label:
      en: Management Node Count
      zh-cn: 管控节点数量
    Description:
      en: 'Number of management nodes, spread across the two zones you select below. 2 is the minimum for component high availability.'
      zh-cn: '管控节点数量，会打散到下方选择的两个可用区。组件高可用最少 2 台。'
    Default: 2
    MinValue: 2
    MaxValue: 10
  NasStorageType:
    Type: String
    Label:
      en: Shared Storage Type
      zh-cn: 共享存储类型
    Description:
      en: The service automatically creates a General-purpose NAS file system as the shared storage (PVC robot-output, RWX) for pipeline intermediate results and final datasets. Performance = higher throughput/IOPS; Capacity = lower cost for large cold data. Deleting the instance deletes this NAS and its data.
      zh-cn: 本服务会自动创建一个通用型 NAS 文件系统作为共享存储（PVC robot-output，RWX），存放流水线中间结果与最终数据集。Performance（性能型）吞吐/IOPS 更高；Capacity（容量型）适合大容量冷数据、更省成本。删除实例会连同该 NAS 及其数据一并删除。
    Default: Performance
    AllowedValues:
      - Performance
      - Capacity
  GpuNodeInstanceType:
    Type: String
    Label:
      en: GPU Compute Node Instance Type
      zh-cn: GPU 算力节点规格
    Description:
      en: '<b>⚠ L20N bare metal is sold out in all regions and its elastic quota defaults to 0 — apply for the L20N quota / whitelist before deploying, otherwise creation fails with InstanceTypeNoStock or QuotaExceed.</b><br>Only L20N bare metal (ebmgn9g*) ships the two eRDMA NICs this service relies on. ecs.ebmgn9g.64xlarge = 256 vCPU / 2304 GiB / 8 x L20N 48 GB (cheapest). The VLA pipeline also runs on it (stages 2/3 each take 0.5 card).'
      zh-cn: '<b>⚠ L20N 裸金属当前全地域售罄、弹性配额默认为 0——部署前必须先申请 L20N 配额/白名单，否则会以 InstanceTypeNoStock 或 QuotaExceed 失败。</b><br>只有 L20N 裸金属（ebmgn9g*）默认配备本服务依赖的两张 eRDMA 网卡。ecs.ebmgn9g.64xlarge = 256 vCPU / 2304 GiB / 8×L20N 48G（最便宜）。VLA 流水线也跑在它上（Stage 2/3 各占 0.5 卡）。'
    Default: ecs.ebmgn9g.64xlarge
    AllowedValues:
      - ecs.ebmgn9g.64xlarge
      - ecs.ebmgn9gc.64xlarge
      - ecs.ebmgn9ge.64xlarge
    Required: true
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      ZoneId: ${ZoneId}
      CreateACKClusterParams:
        NetworkPlugin: terway-eniip
  GpuNodeCount:
    Type: Number
    Label:
      en: GPU Node Count
      zh-cn: GPU 节点数量
    Description:
      en: 'Number of GPU nodes. All GPU nodes sit in the primary zone so that they share the same vSwitch and storage mount path. <b>One node with one card is enough to run the built-in demo end to end</b> (the two GPU stages each take 0.5 card and share it); scale out only when you want more parallelism.'
      zh-cn: 'GPU 节点数量。GPU 节点全部落在主可用区，以便共用同一交换机与存储挂载路径。<b>1 节点 1 卡即可完整跑通内置 Demo</b>（两个 GPU 阶段各占 0.5 卡、共居一张卡）；只有需要更高并行度时才扩容。'
    Default: 1
    MinValue: 0
    MaxValue: 16
  # 注：以下四个属于内部实现细节的参数已不再向消费者暴露，直接写死在资源里：
  #   GpuNodeSystemDiskSize → 500 GiB；NvidiaDriverVersion → 不固定（由 ACK 为所选 GPU 规格装默认驱动）；
  #   NodeImageType → AliyunLinux3ContainerOptimized；ContainerdVersion → 2.1.9。
  # 后两个只有一个合法取值（1.35+ 集群只接受 cgroup v2 镜像，containerd 只提供 2.1.9），
  # 暂露给用户只会多出两个填错就整栈失败的机会。后续 ACK 变更时由服务商改模板。
  #
  # 以下 OSS 参数参照 service-c8bf02afe7544025be47（LLM 推理服务-容器集群）的做法：
  # 默认新建 Bucket + 自动创建仅限该 Bucket 权限的 RAM 用户与 AK，消费者无需自备 AK。
  CreateOSS:
    Type: String
    Label:
      en: OSS Bucket Option
      zh-cn: OSS Bucket 选项
    Description:
      en: 'The OSS bucket holds the input videos and model weights, and is mounted read-only into the pipeline pods.<br><b>New Bucket</b>: creates a bucket automatically and generates a dedicated RAM user + AccessKey scoped to it.<br><b>Existing Bucket</b>: reuses a bucket you already have.'
      zh-cn: 'OSS Bucket 用于存放输入视频与模型权重，以只读方式挂载进流水线 Pod。<br><b>新建Bucket</b>：自动创建 Bucket，并生成仅限该 Bucket 权限的专用 RAM 用户与 AccessKey，无需您提供凭证。<br><b>已有Bucket</b>：复用您已有的 Bucket。'
    Default: 新建Bucket
    Required: true
    AllowedValues:
      - 新建Bucket
      - 已有Bucket
  ExistingOSSBucket:
    Type: String
    Label:
      en: Existing OSS Bucket Name
      zh-cn: 已有 OSS Bucket 名称
    Description:
      en: 'Name of the existing OSS bucket (required when not creating a new one). It must be in the same region as the cluster.'
      zh-cn: '已有 OSS Bucket 的名称（选「已有Bucket」时必填），需与集群同地域。'
    Default: ''
    AssociationProperty: 'ALIYUN::OSS::Bucket::BucketName'
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ${CreateOSS}
            - 已有Bucket
  OSSAkOption:
    Type: String
    Label:
      en: OSS AccessKey Option
      zh-cn: OSS AK 选项
    Description:
      en: '<b>Auto-create AccessKey</b>: ComputeNest creates a RAM user and AccessKey with permissions limited to the bucket above (recommended).<br><b>Use existing AccessKey</b>: you provide an AccessKey that already has oss:* permission on that bucket.'
      zh-cn: <b>自动创建 AccessKey</b>：由服务自动创建 RAM 用户与 AccessKey，权限仅限上方 Bucket（推荐）。<br><b>使用已有 AccessKey</b>：您自行提供对该 Bucket 有 oss:* 权限的 AccessKey（需的权限策略见下方“已有 AccessKey 所需权限策略”）。
    Default: NewAK
    Required: true
    AllowedValues:
      - NewAK
      - ExistAK
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewAK:
          zh-cn: 自动创建 AccessKey
          en: Auto-create AccessKey
        ExistAK:
          zh-cn: 使用已有 AccessKey
          en: Use existing AccessKey
  AccessKeyId:
    Type: String
    Label:
      en: Access Key ID
      zh-cn: AccessKeyId
    Description:
      en: 'AccessKey ID that has oss:* permission on the bucket (required only when OSS AK Option is ExistAK).'
      zh-cn: '已有 AccessKeyId，需对上方 Bucket 有 oss:* 权限（仅当 OSS AK 选项为 ExistAK 时需填）。'
    Default: ''
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ${OSSAkOption}
            - ExistAK
  AccessKeySecret:
    NoEcho: true
    Type: String
    Label:
      en: Access Key Secret
      zh-cn: AccessKeySecret
    Description:
      en: 'AccessKey Secret of the AccessKey above. Stored as a Kubernetes Secret in the solution namespace.'
      zh-cn: '上述 AccessKey 对应的 Secret，以 Kubernetes Secret 形式保存在方案命名空间中。'
    Default: ''
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ${OSSAkOption}
            - ExistAK
  ExistingAccessKeyRequiredPolicy:
    Type: String
    Label:
      en: Required RAM Policy for Existing AccessKey
      zh-cn: 已有 AccessKey 所需权限策略
    Description:
      en: 'When OSS AK Option is ExistAK, attach the following policy to the RAM user/role that owns the AccessKey (oss:* on the target bucket). Auto-filled by the selected bucket option.'
      zh-cn: '当 OSS AK 选项为 ExistAK 时，请给该 AccessKey 对应的 RAM 用户/角色配置以下权限（对目标 Bucket 的 oss:*）。内容根据 Bucket 选项自动填充。'
    AssociationProperty: ALIYUN::OOS::Command::CommandContent
    ReadOnly: true
    Default: ''
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ${OSSAkOption}
            - ExistAK
      DynamicValue:
        - Condition:
            Fn::Equals:
              - ${CreateOSS}
              - 新建Bucket
          Value: |
            {
              "Version": "1",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "oss:*"
                  ],
                  "Resource": [
                    "acs:oss:*:*:robot-data-*",
                    "acs:oss:*:*:robot-data-*/*"
                  ]
                }
              ]
            }
        - Condition:
            Fn::Equals:
              - ${CreateOSS}
              - 已有Bucket
          Value: |
            {
              "Version": "1",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "oss:*"
                  ],
                  "Resource": [
                    "acs:oss:*:*:<%= ExistingOSSBucket %>",
                    "acs:oss:*:*:<%= ExistingOSSBucket %>/*"
                  ]
                }
              ]
            }
  ZoneId:
    Type: String
    Label:
      en: Primary Zone ID
      zh-cn: 主可用区
    Description:
      en: 'Primary zone. The GPU node pool is pinned to this zone only, so that GPU nodes share one vSwitch and stay in the same zone as the shared storage mount target. Pick a zone that has inventory for the GPU instance type you selected.'
      zh-cn: '主可用区。GPU 节点池只落在该可用区，以便 GPU 节点共用同一交换机，并与共享存储的挂载点同可用区。请选择所选 GPU 规格有库存的可用区。'
    Required: true
    AssociationProperty: ALIYUN::ECS::Instance:ZoneId
  ZoneIdSecondary:
    Type: String
    Label:
      en: Secondary Zone ID
      zh-cn: 次可用区
    Description:
      en: 'Secondary zone, used only to spread management nodes for component high availability. It must differ from the primary zone.'
      zh-cn: '次可用区，仅用于打散管控节点以实现组件高可用，必须与主可用区不同。'
    Required: true
    AssociationProperty: ALIYUN::ECS::Instance:ZoneId
  VpcOption:
    Type: String
    Label:
      en: Select Existing or New VPC
      zh-cn: 选择已有/新建的专有网络
    Default: NewVPC
    AllowedValues:
      - NewVPC
      - ExistingVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewVPC:
          zh-cn: 新建专有网络
          en: New VPC
        ExistingVPC:
          zh-cn: 已有专有网络
          en: Existing VPC
    Required: true
  VpcId:
    Type: String
    Label:
      en: VPC ID
      zh-cn: 专有网络 VPC 实例 ID
    Description:
      en: Please search the ID starting with (vpc-xxx) from console-Virtual Private Cloud
      zh-cn: 现有虚拟专有网络的实例 ID
    Default: ''
    AssociationProperty: 'ALIYUN::ECS::VPC::VPCId'
    AssociationPropertyMetadata:
      RegionId: '${RegionId}'
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  VSwitchId:
    Type: String
    Label:
      en: Primary VSwitch ID
      zh-cn: 主可用区交换机 ID
    Description:
      en: 'Existing vSwitch in the primary zone. It carries management nodes, all GPU nodes and Terway Pod IPs, so a large CIDR (/20 or bigger) is recommended.'
      zh-cn: '主可用区的已有交换机。它承载管控节点、全部 GPU 节点以及 Terway 的 Pod IP，建议使用较大网段（/20 及以上）。'
    Default: ''
    AssociationProperty: 'ALIYUN::ECS::VSwitch::VSwitchId'
    AssociationPropertyMetadata:
      VpcId: '${VpcId}'
      ZoneId: '${ZoneId}'
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  VSwitchIdSecondary:
    Type: String
    Label:
      en: Secondary VSwitch ID
      zh-cn: 次可用区交换机 ID
    Description:
      en: 'Existing vSwitch in the secondary zone, used by management nodes and their Pod IPs.'
      zh-cn: '次可用区的已有交换机，用于管控节点及其 Pod IP。'
    Default: ''
    AssociationProperty: 'ALIYUN::ECS::VSwitch::VSwitchId'
    AssociationPropertyMetadata:
      VpcId: '${VpcId}'
      ZoneId: '${ZoneIdSecondary}'
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR IPv4 Block
      zh-cn: 专有网络 IPv4 网段
    Description:
      zh-cn: VPC 的 ip 地址段范围，<br>您可以使用以下的 ip 地址段或其子网:<br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
      en: 'The ip address range of the VPC in the CidrBlock form; <br>You can use the following ip address ranges and their subnets: <br><font color=''green''>[10.0.0.0/8]</font><br><font color=''green''>[172.16.0.0/12]</font><br><font color=''green''>[192.168.0.0/16]</font>'
    Default: 192.168.0.0/16
    AssociationProperty: ALIYUN::VPC::VPC::CidrBlock
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  VSwitchCidrBlock:
    Type: String
    Label:
      en: Primary VSwitch CIDR Block
      zh-cn: 主可用区交换机网段
    Description:
      zh-cn: 必须属于 VPC 的子网段。该网段同时供节点和 Terway Pod 使用，单台 ebmgn9gc 会占用大量 IP，建议 /20 及以上。
      en: Must belong to the subnet segment of VPC. This CIDR serves both nodes and Terway Pod IPs, and a single ebmgn9gc consumes a large number of IPs, so /20 or bigger is recommended.
    Default: 192.168.0.0/20
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  VSwitchCidrBlockSecondary:
    Type: String
    Label:
      en: Secondary VSwitch CIDR Block
      zh-cn: 次可用区交换机网段
    Description:
      zh-cn: 必须属于 VPC 的子网段，且不能与主可用区交换机网段重叠。
      en: Must belong to the subnet segment of VPC and must not overlap the primary vSwitch CIDR.
    Default: 192.168.16.0/20
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  ServiceCidr:
    Type: String
    Label:
      zh-cn: Service CIDR
      en: Service CIDR
    Description:
      zh-cn: 可选范围：10.0.0.0/16-24，172.16-31.0.0/16-24，192.168.0.0/16-24<br>不能与 VPC 及 VPC 内已有 Kubernetes 集群使用的网段重复。<font color='blue'><b>创建成功后不能修改</b></font>
      en: 'Optional range: 10.0.0.0/16-24, 172.16-31.0.0/16-24, 192.168.0.0/16-24<br> cannot duplicate segments already used by existing Kubernetes clusters in VPC and VPC.<font color=''blue''><b>Cannot be modified after successful creation</b></font>'
    Default: 172.16.0.0/16
    AssociationProperty: ALIYUN::CS::ManagedKubernetesCluster::ServiceCidr
    AssociationPropertyMetadata:
      VpcId: ${VpcId}
      RegionId: ${RegionId}
      ClusterType: ManagedKubernetes
      NodeCidrMask: 26

