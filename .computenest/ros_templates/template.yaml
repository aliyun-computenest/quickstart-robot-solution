Conditions:
  # OSS：新建 Bucket / 已有 Bucket；自动新建 RAM 用户+AK / 用户自备 AK
  CreateNewOSSCondition:
    Fn::Equals:
      - 新建Bucket
      - Ref: CreateOSS
  CreateNewRamCondition:
    Fn::Equals:
      - NewAK
      - Ref: OSSAkOption
  PrePaidCondition:
    Fn::Equals:
      - PrePaid
      - Ref: PayType
Resources:
  VpcModule:
    Type: MODULE::ACS::ComputeNest::VpcAndVSwitch
    Version: default
    Properties:
      VpcOption:
        Ref: VpcOption
      VpcId:
        Ref: VpcId
      VpcCidrBlock:
        Ref: VpcCidrBlock
      EnableDualZones: true
      ZoneId:
        Ref: ZoneId
      VSwitchId:
        Ref: VSwitchId
      VSwitchCidrBlock:
        Ref: VSwitchCidrBlock
      ZoneIdSecondary:
        Ref: ZoneIdSecondary
      VSwitchIdSecondary:
        Ref: VSwitchIdSecondary
      VSwitchCidrBlockSecondary:
        Ref: VSwitchCidrBlockSecondary
  # ACK 托管 Pro 集群 + Terway-ENIIP：Terway 基于弹性网卡，Pod 直通 VPC，
  # 数据密集型负载下网络开销低于 flannel 的隧道方案。
  # ACK 托管 Pro 集群（裸资源，不用 MODULE::ACS::ComputeNest::AckOrAcsCluster）。
  # 实测原因：该模块（含最新 v5）给内部 worker 节点池硬编码了 2024-05 的 Alinux3 镜像（cgroup v1），
  # 而 ACK 现只提供 K8s 1.34+（containerd 2.1.9）、要求 cgroup v2 镜像，导致节点池必然创建失败，
  # 且模块无镜像参数、WorkerInstanceCount 最小 1、无可回退的旧 K8s 版本，无法绕过。
  # 自建节点池只指定 ImageType、不锁 ImageId，由 ACK 选当前镜像，即可满足 cgroup v2。
  AckCluster:
    Type: ALIYUN::CS::ManagedKubernetesCluster
    DependsOn:
      - VpcModule
    Properties:
      Name:
        Ref: ALIYUN::StackName
      ClusterSpec: ack.pro.small
      VpcId:
        Fn::GetAtt:
          - VpcModule
          - VpcId
      # 节点与 Pod 均使用这两个交换机（Terway-ENIIP）
      VSwitchIds:
        - Fn::GetAtt:
            - VpcModule
            - VSwitchId
        - Fn::GetAtt:
            - VpcModule
            - VSwitchIdSecondary
      PodVswitchIds:
        - Fn::GetAtt:
            - VpcModule
            - VSwitchId
        - Fn::GetAtt:
            - VpcModule
            - VSwitchIdSecondary
      ServiceCidr:
        Ref: ServiceCidr
      ProxyMode: ipvs
      SnatEntry: true
      EndpointPublicAccess: true
      # 不显式固定 KubernetesVersion / Runtime，跟随 ACK 当前默认，避免版本下线后模板失效
      # 注：Addons 列表内不能用 Fn::If + ALIYUN::NoValue（ROS 会报 NoneType iteritems 内部错误），
      # 因此条件组件（如 cnfs-nas-daemon）用独立的 ClusterAddons 资源安装。
      Addons:
        # ACK 已把 Terway 拆成「控制面 terway-controlplane + 数据面 terway-eniip」两个独立 addon，
        # 两者是**精确版本**配对。实测（DescribeClusterAddonsVersion）当前 ACK 目录存在 skew：
        #   不指定版本时 eniip 解析为 v1.17.6（需 controlplane v1.17.6），但 controlplane 只提供到 v1.17.5
        #   → AddonDependencyNotMet。该 skew 与 K8s 版本无关（1.35/1.36 都一样）。
        # 将两者**都** pin 到可用且一致的 v1.17.5（已用 0 节点集群实测依赖校验通过）。
        # ⚠ 待 ACK 修复目录后（提供与 eniip 匹配的 controlplane），可重新评估是否取消版本固定。
        - Name: terway-controlplane
          Version: v1.17.5
        - Name: terway-eniip
          Version: v1.17.5
        - Name: csi-plugin
        - Name: csi-provisioner
  # 管控节点池：承载 Argo / KubeRay / Fluid / CSI 等组件，跟着两个交换机跨可用区打散
  SysNodePool:
    Type: ALIYUN::CS::ClusterNodePool
    DependsOn:
      - AckCluster
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      Count:
        Ref: SysNodeCount
      NodePoolInfo:
        Name: sys-pool
      ScalingGroup:
        InstanceTypes:
          - Ref: SysNodeInstanceType
        VSwitchIds:
          - Fn::GetAtt:
              - VpcModule
              - VSwitchId
          - Fn::GetAtt:
              - VpcModule
              - VSwitchIdSecondary
        # 1.35+ 集群只接受 cgroup v2 镜像，普通 AliyunLinux3 会被拒
        ImageType: AliyunLinux3ContainerOptimized
        SystemDiskCategory: cloud_essd
        SystemDiskSize: 200
        InstanceChargeType:
          Ref: PayType
        Period:
          Fn::If:
            - PrePaidCondition
            - Ref: PayPeriod
            - Ref: ALIYUN::NoValue
        PeriodUnit:
          Fn::If:
            - PrePaidCondition
            - Ref: PayPeriodUnit
            - Ref: ALIYUN::NoValue
      KubernetesConfig:
        Runtime: containerd
        # ACK 当前为 1.34/1.35/1.36 只提供 containerd 2.1.9；Runtime 与 RuntimeVersion 必须成对
        RuntimeVersion: 2.1.9
        Labels:
          - Key: robot-solution.aliyun.com/node-role
            Value: system
  # 三个组件都是方案必需，不再做开关（关掉任一个方案就不完整）
  KubeRayAddon:
    Type: ALIYUN::CS::ClusterAddons
    DependsOn:
      - SysNodePool
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      Addons:
        - Name: kuberay-operator
      InstalledIgnore: true
      RolePolicy: EnsureAdminRoleAndBinding
      # kuberay-operator 在 ACK 托管 Pro 上是「托管组件」：operator 跑在 ACK 管控面，
      # 集群内看不到任何 Deployment（实测：kubectl get deploy -A 无 kuberay，
      # 但 ray.io 的 CRD 已存在、addon 状态 active）。因此就绪信号只能看 CRD，
      # 不能等 Deployment，否则 JsonPath 取到 None 一定超时。
      # 注：JsonPath 不能以 . 开头；字符串比较无需 ValueType，但 FirstMatch 必须加（否则返回列表）。
      WaitUntil:
        - Kind: CustomResourceDefinition
          ApiVersion: apiextensions.k8s.io/v1
          Name: rayjobs.ray.io
          JsonPath: 'status.acceptedNames.kind'
          FirstMatch: true
          Operator: Equals
          Value: RayJob
          Timeout: 600
  ErdmaControllerAddon:
    Type: ALIYUN::CS::ClusterAddons
    DependsOn:
      - SysNodePool
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      Addons:
        - Name: ack-erdma-controller
          Config: '{"agent":{"preferDriver":"ofed","allocateAllDevices":true}}'
      InstalledIgnore: true
  # 坑 3：Terway 会接管节点上的弹性网卡，导致 L20N 随实例出厂的两张 eRDMA 网卡 IP 冲突。
  # 官方修复方式是给 eni-config 加白名单 eni_tag_filter，只让 Terway 管理自己创建的网卡
  # （Terway 给自建网卡打的标签就是 creator=terway）。该 Job 幂等，且必须在 GPU 节点加入前完成。
  TerwayEniWhitelist:
    Type: ALIYUN::CS::ClusterApplication
    DependsOn:
      - SysNodePool
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      DefaultNamespace: kube-system
      CreationMode: Apply
      # RolePolicy 保持默认 EnsureAdminRoleAndBinding（实测结论，勿改成 None）：
      # ROS 会为部署身份创建 ros:application-admin ClusterRole/Binding，WaitUntil 读取
      # CRD、Deployment 等集群资源全靠它。改成 None 会报 403
      # “User \"<uid>\" cannot get resource customresourcedefinitions at the cluster scope”。
      # 曾见到的 “RAM policy Forbidden for action cs:DescribeUserPermission” 不是模板问题，
      # 而是用服务商（supplier）账号去创建服务实例造成的——该 RAM 用户没有此权限；
      # 正确的部署身份是消费者账号，实测消费者账号可正常调用该接口。
      RolePolicy: EnsureAdminRoleAndBinding
      WaitUntil:
        - Kind: Job
          Name: erdma-terway-eni-whitelist
          Namespace: kube-system
          JsonPath: 'status.succeeded'
          # 两个设置都必选（实测）：不加 FirstMatch 时 JsonPath 返回列表 [1]；
          # 不加 ValueType: Json 时 Value 按字符串 '1' 与整数 1 比较。
          # 两者缺一都会导致 Job 已成功但资源一直等到 ResourceCreateTimeout。
          FirstMatch: true
          Operator: Equals
          Value: '1'
          ValueType: Json
          Timeout: 900
      YamlContent:
        Fn::Sub: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: erdma-terway-patch
            namespace: kube-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: erdma-terway-patch
            namespace: kube-system
          rules:
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["get", "patch"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "delete"]
            - apiGroups: ["apps"]
              resources: ["daemonsets"]
              verbs: ["get", "list", "watch"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: erdma-terway-patch
            namespace: kube-system
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: erdma-terway-patch
          subjects:
            - kind: ServiceAccount
              name: erdma-terway-patch
              namespace: kube-system
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: erdma-terway-eni-whitelist
            namespace: kube-system
          spec:
            backoffLimit: 3
            template:
              metadata:
                labels:
                  app: erdma-terway-eni-whitelist
              spec:
                restartPolicy: OnFailure
                serviceAccountName: erdma-terway-patch
                tolerations:
                  - operator: Exists
                containers:
                  - name: patch
                    image: registry-vpc.${ALIYUN::Region}.aliyuncs.com/acs/kubectl:latest
                    command: ["/bin/bash", "-c"]
                    args:
                      - |
                        set -eo pipefail
                        CONF=$(kubectl -n kube-system get cm eni-config -o jsonpath='{.data.eni_conf}')
                        echo "===== eni_conf before ====="
                        echo "$CONF"
                        if echo "$CONF" | jq -e 'has("eni_tag_filter")' >/dev/null 2>&1; then
                          echo "eni_tag_filter already configured, nothing to do"
                          exit 0
                        fi
                        NEW=$(echo "$CONF" | jq -c '. + {eni_tag_filter: {creator: "terway"}}')
                        kubectl -n kube-system patch cm eni-config --type merge \
                          -p "$(jq -nc --arg c "$NEW" '{data: {eni_conf: $c}}')"
                        echo "===== eni_conf after ====="
                        kubectl -n kube-system get cm eni-config -o jsonpath='{.data.eni_conf}'
                        echo
                        kubectl -n kube-system delete pod -l app=terway-eniip --wait=false
                        sleep 15
                        kubectl -n kube-system rollout status ds/terway-eniip --timeout=420s
                        echo "===== terway restarted with ENI whitelist ====="
  # eRDMA 组件的 DaemonSet 与 Terway 重启都需要时间稳定，之后再拉起 GPU 节点池
  AddonReadySleep:
    Type: ALIYUN::ROS::Sleep
    # GPU 池经 AddonReadySleep 间接依赖：必须等 eRDMA 组件与 Terway 白名单就绪后再拉起 L20N 节点，
    # 否则 eRDMA 不生效（白名单只对新加入节点生效）。
    DependsOn:
      - SysNodePool
      - ErdmaControllerAddon
      - TerwayEniWhitelist
    Properties:
      CreateDuration: 120
  # GPU 算力节点池。固定在主可用区，以便与存储挂载路径、交换机保持一致。
  GpuNodePool:
    Type: ALIYUN::CS::ClusterNodePool
    DependsOn:
      - AddonReadySleep
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      Count:
        Ref: GpuNodeCount
      NodePoolInfo:
        Name: gpu-pool
      ScalingGroup:
        InstanceTypes:
          - Ref: GpuNodeInstanceType
        # GPU 节点全部落主可用区，与存储挂载点保持同可用区
        VSwitchIds:
          - Fn::GetAtt:
              - VpcModule
              - VSwitchId
        ZoneIds:
          - Ref: ZoneId
        # 云市场 eRDMA 镜像 cmjj00066236，按地域从 Mappings 取 ID（服务锁定 hz/bj/sh 三地域，均已覆盖）
        ImageId:
          Fn::FindInMap:
            - ErdmaMarketImage
            - Ref: ALIYUN::Region
            - ImageId
        # 云市场 eRDMA 镜像本身是 cgroup v2 的 Alinux3，配合 Container-Optimized 类型声明
        ImageType: AliyunLinux3ContainerOptimized
        SystemDiskCategory: cloud_essd
        SystemDiskSize: 500
        InstanceChargeType:
          Ref: PayType
        Period:
          Fn::If:
            - PrePaidCondition
            - Ref: PayPeriod
            - Ref: ALIYUN::NoValue
        PeriodUnit:
          Fn::If:
            - PrePaidCondition
            - Ref: PayPeriodUnit
            - Ref: ALIYUN::NoValue
      KubernetesConfig:
        Runtime: containerd
        RuntimeVersion: 2.1.9
        # 固定 NVIDIA 驱动版本为 580.126.09（官方 L20N + eRDMA 文档要求）。
        # 保留 robot-solution.aliyun.com/node-role=gpu：VLA Demo 靠它调度到 GPU 节点。
        Labels:
          - Key: ack.aliyun.com/nvidia-driver-version
            Value: '580.126.09'
          - Key: robot-solution.aliyun.com/node-role
            Value: gpu
        # 隔离 GPU 节点，防止管控组件调度上来占用算力；Demo 通过 toleration 调度
        Taints:
          - Key: nvidia.com/gpu
            Value: 'true'
            Effect: NoSchedule
        # 注（实测踩坑）：这里必须传**明文脚本**，不能用 Fn::Base64Encode。
        # ROS 会自己做编码（官方说明：User data should not be base64 encoded）。
        # 若自行 base64，ACK 会把这串 base64 当成脚本正文写进节点的
        # /var/lib/cloud/instance/user-data.txt，脚本一行都不会执行 —— 现象是节点正常入集群、
        # 但 /usr/bin/disable_pcie_acs 不存在、/var/log/erdma-bootstrap.log 也不存在，且毫无报错。
        UserData:
          Fn::Join:
            - ''
            - - "#!/bin/bash\nERDMA_INSTALLER_URL='http://mirrors.cloud.aliyuncs.com/erdma/erdma_installer-1.5.9.tar.gz'\n"
              - |
                # L20N eRDMA 节点初始化：① 升级 eRDMA 驱动 ② 关闭 PCIe ACS ③ 落地并执行环境体检
                # 全过程只告警不退出，避免单项失败导致整个节点池创建回滚。
                exec >>/var/log/erdma-bootstrap.log 2>&1
                set -x
                date
                ERDMA_MIRROR='http://mirrors.cloud.aliyuncs.com/erdma'

                # ① 升级 eRDMA 驱动大包。≥1.5.9 默认启用 MPCC 拥塞算法，且 NCCL 不再需要 NCCL_GRAPH_FILE。
                if [ -n "$ERDMA_INSTALLER_URL" ]; then
                  cd /root
                  curl -fsSL -O "$ERDMA_MIRROR/env_setup.sh" \
                    && bash env_setup.sh --url "$ERDMA_INSTALLER_URL" \
                    || echo "[WARN] erdma driver upgrade failed, falling back to the driver shipped in the image"
                fi

                # ② 关闭 PCIe ACS。L20N 的 8 张卡之间没有 NVLink/NVSwitch，机内通信走 PCIe，
                # 关闭 ACS 才能打开 GPU 与 eRDMA 网卡之间的 P2P 能力。
                cat <<'ACSEOF' >/usr/bin/disable_pcie_acs
                #!/bin/bash
                ret=0
                found_acs_pci=0
                for BDF in $(lspci -d "*:*:*" | awk '{print $1}'); do
                  setpci -v -s ${BDF} ECAP_ACS+0x6.w >/dev/null 2>&1
                  if [ $? -ne 0 ]; then
                    continue
                  else
                    found_acs_pci=1
                    setpci -v -s ${BDF} ECAP_ACS+0x6.w=0000
                    if [ $? -eq 0 ]; then
                      echo "[SUCCESS] Disabled ACS on ${BDF}"
                    else
                      echo "[ERROR] Failed to Disable ACS on ${BDF}"
                      ((ret++))
                    fi
                  fi
                done
                if [ $found_acs_pci -eq 0 ]; then
                  echo "[SKIP] no device found that supports ACS"
                fi
                exit $ret
                ACSEOF
                chmod +x /usr/bin/disable_pcie_acs
                cat <<'SVCEOF' >/etc/systemd/system/disable_pcie_acs.service
                [Unit]
                Description=Disable PCIe Access Control Services (ACS)
                After=multi-user.target

                [Service]
                Type=oneshot
                ExecStart=/usr/bin/disable_pcie_acs
                RemainAfterExit=yes

                [Install]
                WantedBy=multi-user.target
                SVCEOF
                systemctl daemon-reload
                systemctl enable disable_pcie_acs.service
                systemctl start disable_pcie_acs.service

                # ③ 落地官方体检脚本并立即自检一次，结果留档便于事后排查
                curl -fsSL -o /usr/local/bin/erdma_env_check.py "$ERDMA_MIRROR/tools/env_check.py" \
                  && python3 /usr/local/bin/erdma_env_check.py -s egs_l20n --json >/var/log/erdma_env_check.json 2>&1
                ibv_devices
                ibv_devinfo | grep -E 'hca_id|state:|active_mtu'
                lspci -vvv 2>/dev/null | grep ACSCtl | sort | uniq -c
                date
                # 完成标记：三步全部跑完才 touch。体检 DaemonSet 会等这个文件出现再开始检查，
                # 因为节点 Ready 早于 cloud-init/UserData 跑完（eRDMA 驱动 DKMS 编译耗时），
                # 不等标记的话“部署完即可看 PASS”会看到步骤②③尚未落地的不完整报告。
                touch /var/log/erdma-bootstrap.done
                echo '===== erdma bootstrap finished ====='
  # 坑 5：把「登录一台节点跑 env_check.py」做成集群内的常驻体检 DaemonSet，
  # 每台 L20N 节点各跑一次，结果直接用 kubectl logs 查看，无需登录机器。
  # 借 hostPID + privileged 通过 chroot /proc/1/root 进入宿主机执行，因此复用同一个工具镜像。
  ErdmaEnvCheck:
    Type: ALIYUN::CS::ClusterApplication
    DependsOn:
      - GpuNodePool
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      DefaultNamespace: erdma-check
      CreationMode: Apply
      # 就绪门禁：等体检 DaemonSet 的 numberReady 达到 GPU 节点数。容器配了 readinessProbe
      # 盯 sentinel /tmp/checkdone（检查全部跑完才 touch），所以 numberReady==1 等于“完整报告已生成”。
      # 不加门禁 / 不配 readinessProbe 的话，节点 Ready（早于 cloud-init 跑完）就会让实例
      # 提前进 Deployed，用户此时跑 Step1 拿到步骤②③尚未落地的不完整报告。
      # Value 用 ${GpuNodeCount}：GpuNodeCount=0（先部署控制面、拿到白名单再加 L20N）时
      # 等 numberReady==0 立即满足，不会卡死整栈。Timeout 2400s 给 L20N 驱动编译留足余量。
      # 数值判定必须 FirstMatch:true + ValueType:Json，否则就绪了也会等到超时回滚。
      WaitUntil:
        - Kind: DaemonSet
          Name: erdma-env-check
          Namespace: erdma-check
          JsonPath: 'status.numberReady'
          FirstMatch: true
          Operator: Equals
          Value:
            Fn::Sub: '${GpuNodeCount}'
          ValueType: Json
          Timeout: 2400
      # RolePolicy 保持默认 EnsureAdminRoleAndBinding（实测结论，勿改成 None）：
      # ROS 会为部署身份创建 ros:application-admin ClusterRole/Binding，WaitUntil 读取
      # CRD、Deployment 等集群资源全靠它。改成 None 会报 403
      # “User \"<uid>\" cannot get resource customresourcedefinitions at the cluster scope”。
      # 曾见到的 “RAM policy Forbidden for action cs:DescribeUserPermission” 不是模板问题，
      # 而是用服务商（supplier）账号去创建服务实例造成的——该 RAM 用户没有此权限；
      # 正确的部署身份是消费者账号，实测消费者账号可正常调用该接口。
      RolePolicy: EnsureAdminRoleAndBinding
      YamlContent:
        Fn::Sub:
          - |
            apiVersion: v1
            kind: Namespace
            metadata:
              name: erdma-check
            ---
            apiVersion: apps/v1
            kind: DaemonSet
            metadata:
              name: erdma-env-check
              namespace: erdma-check
              labels:
                app: erdma-env-check
            spec:
              selector:
                matchLabels:
                  app: erdma-env-check
              template:
                metadata:
                  labels:
                    app: erdma-env-check
                spec:
                  hostPID: true
                  hostNetwork: true
                  nodeSelector:
                    robot-solution.aliyun.com/node-role: gpu
                  tolerations:
                    - operator: Exists
                  containers:
                    - name: check
                      image: registry-vpc.${ALIYUN::Region}.aliyuncs.com/acs/kubectl:latest
                      securityContext:
                        privileged: true
                        runAsUser: 0
                      # 关键：默认容器一启动就算 Ready（numberReady 立即=1），会让
                      # WaitUntil 在检查还没跑完时就放行。用 readinessProbe 盯住 sentinel 文件
                      # /tmp/checkdone（检查全部跑完才 touch），让 numberReady==1 真正等于“完整报告已生成”。
                      # 最长容忍 bootstrap 30min + 检查：period 15s × failureThreshold 160 ≈ 40min。
                      readinessProbe:
                        exec:
                          command: ["/bin/bash", "-c", "test -f /tmp/checkdone"]
                        initialDelaySeconds: 20
                        periodSeconds: 15
                        failureThreshold: 160
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi
                        limits:
                          cpu: 500m
                          memory: 512Mi
                      command: ["/bin/bash", "-c"]
                      args:
                        - |
                          host() { chroot /proc/1/root /bin/bash -c "$1"; }
                          # 先等节点 UserData 引导完成（disable_pcie_acs / env_check 落地）。
                          # 节点 Ready 早于 cloud-init 跑完，不等就检查会误报步骤②③未完成；
                          # 最多等 30 分钟（小于 WaitUntil 的 40 分钟超时），超时则带警告继续。
                          echo "等待节点 UserData 引导完成（/var/log/erdma-bootstrap.done）..."
                          for w in $(seq 1 180); do
                            host "test -f /var/log/erdma-bootstrap.done" && { echo "  引导已完成"; break; }
                            sleep 10
                          done
                          host "test -f /var/log/erdma-bootstrap.done" || echo "[WARN] 30 分钟内未见引导完成标记，驱动可能仍在编译，以下结果可能不完整"
                          PASS=0; FAIL=0; SKIP=0
                          RESULT=""
                          # ok <编号> <名称> <判定命令>：命令退出码 0 算 PASS。
                          # 这里不用 || true 兔子，否则永远看不出真失败。
                          ok() {
                            n="$1"; title="$2"; shift 2
                            if host "$*" >/tmp/o 2>&1; then
                              echo "  [PASS] $n $title"
                              PASS=$((PASS+1)); RESULT="$RESULT\n  [PASS] $n $title"
                            else
                              echo "  [FAIL] $n $title"
                              sed 's/^/         /' /tmp/o | head -4
                              FAIL=$((FAIL+1)); RESULT="$RESULT\n  [FAIL] $n $title"
                            fi
                          }
                          echo "##### eRDMA 体检  node=$NODE_NAME #####"
                          echo
                          echo "===== A. 判定项（每项 PASS/FAIL）====="
                          ok 1 "eRDMA 内核模块已加载" "lsmod | grep -q erdma"
                          ok 2 "两张 eRDMA 设备存在" "test \$(ibv_devices 2>/dev/null | grep -c erdma) -ge 2"
                          ok 3 "两张网卡均 PORT_ACTIVE" "test \$(ibv_devinfo 2>/dev/null | grep -c 'state:.*PORT_ACTIVE') -ge 2"
                          ok 4 "MTU 4096" "ibv_devinfo 2>/dev/null | grep -q 'active_mtu:.*4096'"
                          ok 5 "NUMA 分别绑定 0 与 1" "test \"\$(cat /sys/class/infiniband/erdma_0/device/numa_node 2>/dev/null)\" = 0 -a \"\$(cat /sys/class/infiniband/erdma_1/device/numa_node 2>/dev/null)\" = 1"
                          ok 6 "PCIe ACS 已关闭（SrcValid-）" "! (lspci -vvv 2>/dev/null | grep ACSCtl | grep -q 'SrcValid+')"
                          ok 7 "disable_pcie_acs 开机自启" "systemctl is-enabled disable_pcie_acs.service"
                          ok 8 "eadm 可用（驱动已升级）" "command -v eadm"
                          ok 9 "GPU 已被识别" "nvidia-smi -L | grep -q GPU"
                          # 固定驱动版本时，校验实际装上的是不是请求的那个。不校验的话，标签写了
                          # ACK 不支持的版本只会静默装成另一个版本，没人发现。
                          # PINNED_DRIVER 由 DaemonSet 环境变量注入（未固定时为空）。
                          if [ -n "$PINNED_DRIVER" ]; then
                            ok 10 "NVIDIA 驱动版本等于所固定的 $PINNED_DRIVER" "nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1 | grep -q '^$PINNED_DRIVER'"
                          else
                            echo "  [SKIP] 10 未固定 NVIDIA 驱动版本，由 ACK 装默认驱动"
                            SKIP=$((SKIP+1))
                          fi
                          echo
                          echo "===== B. 官方一键体检 env_check.py -s egs_l20n ====="
                          host "test -f /usr/local/bin/erdma_env_check.py || curl -fsSL -o /usr/local/bin/erdma_env_check.py http://mirrors.cloud.aliyuncs.com/erdma/tools/env_check.py; python3 /usr/local/bin/erdma_env_check.py -s egs_l20n" || echo "[WARN] env_check.py 未能执行"
                          echo
                          echo "===== C. 原始信息（排查用）====="
                          echo "-- ibv_devinfo --";  host "ibv_devinfo | grep -E 'hca_id|state:|active_mtu'" || true
                          echo "-- 拥塞控制（期望 mpcc）--"; host "eadm conf -d erdma_0 -t cc; eadm conf -d erdma_1 -t cc" || true
                          echo "-- GID（不应冲突）--"; host "show_gids" || true
                          echo "-- ACSCtl --"; host "lspci -vvv 2>/dev/null | grep ACSCtl | sort | uniq -c" || true
                          echo "-- 驱动版本 --"; host "eadm ver 2>/dev/null; nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv" || true
                          echo
                          echo "##### SUMMARY node=$NODE_NAME  PASS=$PASS FAIL=$FAIL SKIP=$SKIP #####"
                          echo -e "$RESULT"
                          if [ "$FAIL" -gt 0 ]; then
                            echo "##### 结论：有 $FAIL 项未通过，详见上方 [FAIL] 条目与 C 区原始信息 #####"
                          else
                            echo "##### 结论：全部判定项 PASS，eRDMA 环境就绪 #####"
                          fi
                          # 写 sentinel：readinessProbe 命中它才算 Ready，numberReady==1 于此才成立，
                          # 也就保证了“部署完即可看到完整报告”。
                          touch /tmp/checkdone
                          # 容器常驻，保证 kubectl logs 随时可读
                          sleep infinity
                      env:
                        - name: NODE_NAME
                          valueFrom:
                            fieldRef:
                              fieldPath: spec.nodeName
                        # 固定驱动时由 Fn::Sub 注入版本号（未固定时为空，体检项 10 转 SKIP）
                        - name: PINNED_DRIVER
                          value: "${PinnedDriver}"

          - PinnedDriver: '580.126.09'
  # 只读输入层：OSS Bucket 由本模板创建，不依赖客户已有资源。
  # Bucket 名取 StackId 前 8 位十六进制（小写，满足 OSS 命名规则），保证全局唯一；
  # 不能用 StackName，计算巢实例名含大写字母，OSS Bucket 名不允许大写。
  OssBucket:
    Type: ALIYUN::OSS::Bucket
    Condition: CreateNewOSSCondition
    Properties:
      BucketName:
        Fn::Join:
          - '-'
          - - robot-data
            - Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Ref: ALIYUN::StackId
      AccessControl: private
      RedundancyType: LRS
      StorageClass: Standard
      # 写死 true：本模板会预建 dataset/ 与 models/ 目录，Bucket 永远非空，
      # 若为 false 则实例永远删不掉。删除实例前请自行备份需要保留的数据。
      DeletionForce: true
  # 自动创建专用 RAM 用户与 AccessKey，权限仅限上方 Bucket（参照 LLM 推理服务-容器集群的做法）。
  # 这样消费者不需要自备 AK，也避开了把个人全局 AK 填进服务参数的风险。
  OssRamUser:
    Type: ALIYUN::RAM::User
    Condition: CreateNewRamCondition
    Properties:
      UserName:
        Ref: ALIYUN::StackName
      Policies:
        - PolicyName:
            Ref: ALIYUN::StackName
          PolicyDocument:
            Version: '1'
            Statement:
              - Effect: Allow
                Action:
                  - 'oss:*'
                Resource:
                  - Fn::Sub:
                      - 'acs:oss:*:*:${BucketName}'
                      - BucketName:
                          Fn::If:
                            - CreateNewOSSCondition
                            - Fn::GetAtt:
                                - OssBucket
                                - Name
                            - Ref: ExistingOSSBucket
                  - Fn::Sub:
                      - 'acs:oss:*:*:${BucketName}/*'
                      - BucketName:
                          Fn::If:
                            - CreateNewOSSCondition
                            - Fn::GetAtt:
                                - OssBucket
                                - Name
                            - Ref: ExistingOSSBucket
  OssAccessKey:
    Type: ALIYUN::RAM::AccessKey
    Condition: CreateNewRamCondition
    DependsOn: OssRamUser
    Properties:
      UserName:
        Ref: ALIYUN::StackName
  # 预建两个前缀：ossfs 挂载子目录时，目录不存在会导致挂载失败
  # （已有 Bucket 也一样预建；已存在时为幂等操作）
  OssDatasetDirectory:
    Type: ALIYUN::OSS::Directory
    Properties:
      BucketName:
        Fn::If:
          - CreateNewOSSCondition
          - Fn::GetAtt:
              - OssBucket
              - Name
          - Ref: ExistingOSSBucket
      DirectoryName: dataset/
      # 写死 true：本模板会预建 dataset/ 与 models/ 目录，Bucket 永远非空，
      # 若为 false 则实例永远删不掉。删除实例前请自行备份需要保留的数据。
      DeletionForce: true
  OssModelsDirectory:
    Type: ALIYUN::OSS::Directory
    Properties:
      BucketName:
        Fn::If:
          - CreateNewOSSCondition
          - Fn::GetAtt:
              - OssBucket
              - Name
          - Ref: ExistingOSSBucket
      DirectoryName: models/
      # 写死 true：本模板会预建 dataset/ 与 models/ 目录，Bucket 永远非空，
      # 若为 false 则实例永远删不掉。删除实例前请自行备份需要保留的数据。
      DeletionForce: true
  # OSS 预检（参照 service-c8bf02afe7544025be47 的 WaitCondition 回传做法）：
  # 在创建只读卷之前，先用 ossutil 验证 Bucket 可访问、AK 权限可用、两个前缀存在，
  # 并把人类可读的失败原因 curl 回 ROS。否则 AK 权限不对 / Bucket 跟集群不同地域
  # 只会表现为 PVC 一直 Pending，用户在计算巢控制台看不到任何原因。
  # 用 internal endpoint 顺便把「跟集群同地域」也一并校验了（跨地域 Bucket 走内网域名解析不到）。
  OssPreflightWaitConditionHandle:
    Type: ALIYUN::ROS::WaitConditionHandle
  OssPreflightApplication:
    Type: ALIYUN::CS::ClusterApplication
    DependsOn:
      - AddonReadySleep
      - OssDatasetDirectory
      - OssModelsDirectory
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      CreationMode: Apply
      DefaultNamespace: default
      YamlContent:
        Fn::Sub:
          - |
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: robot-oss-preflight
              namespace: default
            spec:
              backoffLimit: 0
              ttlSecondsAfterFinished: 600
              template:
                metadata:
                  name: robot-oss-preflight
                spec:
                  restartPolicy: Never
                  containers:
                    - name: preflight
                      image: compute-nest-registry.cn-hangzhou.cr.aliyuncs.com/public/ossutil:2.0
                      resources:
                        requests:
                          cpu: '200m'
                          memory: 256Mi
                        limits:
                          cpu: '1'
                          memory: 1Gi
                      command: ["/bin/bash", "-c", "--"]
                      args:
                        - |
                          set -x
                          CurlCli=$(echo ${CurlCli} | base64 -d)

                          # 失败时把原因回传 ROS，用户在计算巢控制台能直接看到。
                          # 注（实测）：ROS 会截断 StatusReason，所以必须把「排查指引」放在最前面、
                          # 原始报错放在后面，否则用户只能看到一段 ossutil 原文而不知道该改什么。
                          fail() {
                            sleep 3
                            echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1<br>" > /tmp/fail.log
                            if [ -s /tmp/out.txt ]; then
                              echo "原始报错：$(cat /tmp/out.txt)" >> /tmp/fail.log
                            fi
                            cat /tmp/fail.log >&2
                            reason=$(cat /tmp/fail.log | tr '\n\t' ' ')
                            eval "$CurlCli -d \"{\\\"reason\\\":\\\"$reason\\\",\\\"status\\\":\\\"FAILURE\\\"}\""
                            exit 1
                          }

                          cat > /tmp/oss.cfg <<EOF
                          [Credentials]
                          endpoint = ${OssEndpoint}
                          accessKeyID = ${AkId}
                          accessKeySecret = ${AkSecret}
                          region = ${RegionId}
                          EOF

                          # 1) Bucket 是否可访问（同时校验 AK 权限与同地域）
                          if ! ossutil --config-file /tmp/oss.cfg ls oss://${BucketName}/ --limited-num 1 > /tmp/out.txt 2>&1; then
                            fail "OSS 预检失败：无法访问 Bucket ${BucketName}。请检查 ① Bucket 名是否填写正确且已存在；② Bucket 是否与集群同地域（当前走内网域名 ${OssEndpoint}，跟地域不同的 Bucket 连不上）；③ AccessKey 是否对该 Bucket 有 oss:* 权限。"
                          fi

                          # 2) 两个必需前缀是否存在（ossfs 挂子目录时目录不存在会挂载失败）
                          for prefix in dataset models; do
                            if ! ossutil --config-file /tmp/oss.cfg ls oss://${BucketName}/$prefix/ > /tmp/out.txt 2>&1; then
                              fail "OSS 预检失败：前缀 $prefix/ 不可访问。请确认 Bucket ${BucketName} 下存在 $prefix/ 目录，且 AccessKey 对其有读权限。"
                            fi
                          done

                          # 3) 提示数据准备情况（不作为失败条件）。
                          # 注（实测）：reason 不会进 WaitCondition 的 Data 属性，必须额外给 data 字段，
                          # 才能用 Fn::GetAtt 取出来做 Output（形式为 {"1": "..."}）。
                          n_video=$(ossutil --config-file /tmp/oss.cfg ls oss://${BucketName}/dataset/ 2>/dev/null | grep -c 'oss://' || true)
                          n_model=$(ossutil --config-file /tmp/oss.cfg ls oss://${BucketName}/models/ 2>/dev/null | grep -c 'oss://' || true)
                          summary="OSS 预检通过：Bucket ${BucketName} 可读写，dataset/ 当前 $n_video 个对象，models/ 当前 $n_model 个对象"
                          eval "$CurlCli -d \"{\\\"reason\\\":\\\"$summary\\\",\\\"data\\\":\\\"$summary\\\",\\\"status\\\":\\\"SUCCESS\\\"}\""
          - BucketName:
              Fn::If:
                - CreateNewOSSCondition
                - Fn::GetAtt:
                    - OssBucket
                    - Name
                - Ref: ExistingOSSBucket
            AkId:
              Fn::If:
                - CreateNewRamCondition
                - Fn::GetAtt:
                    - OssAccessKey
                    - AccessKeyId
                - Ref: AccessKeyId
            AkSecret:
              Fn::If:
                - CreateNewRamCondition
                - Fn::GetAtt:
                    - OssAccessKey
                    - AccessKeySecret
                - Ref: AccessKeySecret
            RegionId:
              Ref: ALIYUN::Region
            OssEndpoint:
              Fn::Sub: 'oss-${ALIYUN::Region}-internal.aliyuncs.com'
            CurlCli:
              Fn::Replace:
                - "\n": ''
                - Fn::Base64Encode:
                    Fn::GetAtt:
                      - OssPreflightWaitConditionHandle
                      - CurlCli
  OssPreflightWaitCondition:
    Type: ALIYUN::ROS::WaitCondition
    DependsOn: OssPreflightApplication
    Properties:
      Count: 1
      Handle:
        Ref: OssPreflightWaitConditionHandle
      Timeout: 900
  # 通用型 NAS：按量付费、全地域全可用区可用，作为默认的 RWX 输出卷
  NasFileSystem:
    Type: ALIYUN::NAS::FileSystem
    Properties:
      FileSystemType: standard
      ProtocolType: NFS
      StorageType:
        Ref: NasStorageType
      ChargeType: PayAsYouGo
      VpcId:
        Fn::GetAtt:
          - VpcModule
          - VpcId
      VSwitchId:
        Fn::GetAtt:
          - VpcModule
          - VSwitchId
      # 不指定 ZoneId：NAS 开服可用区与 GPU 可用区并不一致（如北京 NAS 不支持 f 区），
      # 绑定主可用区会报 InvaildZone.NotExist；交给 NAS 自选支持的可用区最稳。
      Description:
        Fn::Sub: '${ALIYUN::StackName}-robot-output'
      # 写死 true：本模板会预建 dataset/ 与 models/ 目录，Bucket 永远非空，
      # 若为 false 则实例永远删不掉。删除实例前请自行备份需要保留的数据。
      DeletionForce: true
  NasMountTarget:
    Type: ALIYUN::NAS::MountTarget
    Properties:
      FileSystemId:
        Fn::GetAtt:
          - NasFileSystem
          - FileSystemId
      AccessGroupName: DEFAULT_VPC_GROUP_NAME
      NetworkType: Vpc
      VpcId:
        Fn::GetAtt:
          - VpcModule
          - VpcId
      VSwitchId:
        Fn::GetAtt:
          - VpcModule
          - VSwitchId
  # Argo Workflows 用 ACK 托管 addon ack-workflow（3.5.15）安装，替代原来的 Helm chart 部署物：
  # - 镜像走 ACK 地域 VPC 仓库（acs/*），国内可达；无需 crds.full=false 去躲 registry.k8s.io/kubectl 钩子
  # - addon 自行处理 CRD 与 RBAC；clusterscope 默认监听全命名空间（含 robot-demo）
  # - 去掉了 argo 的 HelmChart 部署物，import 不再依赖 argo tgz
  # 实测（真机 L20N）：卸载 Helm v4.0.8 换本 addon 后 Demo B 两阶段 Succeeded。
  ArgoWorkflowsAddon:
    Type: ALIYUN::CS::ClusterAddons
    DependsOn:
      - AddonReadySleep
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      Addons:
        - Name: ack-workflow
          Version: 3.5.15
      InstalledIgnore: true
      RolePolicy: EnsureAdminRoleAndBinding
      # 等 workflows CRD 建立，确认 addon 已装好（与 KubeRayAddon 同款模式）
      WaitUntil:
        - Kind: CustomResourceDefinition
          ApiVersion: apiextensions.k8s.io/v1
          Name: workflows.argoproj.io
          JsonPath: status.acceptedNames.kind
          FirstMatch: true
          Operator: Equals
          Value: Workflow
          Timeout: 600
  # Fluid 用 MODULE::ACS::ComputeNest::FluxOciHelmDeploy 而不是 ALIYUN::CS::ClusterHelmApplication（实测必须）：
  # 计算巢 HelmChart 部署物占位符解析成 oci://...，而 ClusterHelmApplication.ChartUrl 约束是 ^(http|https)://，
  # 传 oci:// 会报 does not match pattern 而失败；FluxOciHelmDeploy 只收 oci 地址，并用 DockerConfigJson 占位符拿拉取凭证。
  FluidApplication:
    Type: MODULE::ACS::ComputeNest::FluxOciHelmDeploy
    Version: v1
    DependsOn:
      - AddonReadySleep
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      HelmChartUrl: '{{ computenest::helmchart::fluid }}'
      DockerConfigJson: '{{ computenest::helm::dockerconfigjson }}'
      ReleaseName: ack-fluid
      Namespace: fluid-system
      # 重要（实测）：这里用的是 ACK 发行的 ack-fluid chart，不能用社区版 fluid chart。
      # 1) 社区版 fluid ≥ 1.0.0 的 templates/webhook/plugins-profile.yaml 用了 Helm 的 lookup 函数，
      #    计算巢/ACK 侧的 Helm 渲染器不支持，直接报
      #    “parse error at (fluid/templates/webhook/plugins-profile.yaml:12): function "lookup" not defined”，
      #    与 chart 托管在哪里、镜像换不换源都无关（是 parse 阶段就失败）。
      # 2) 社区版 0.9.x 虽能渲染，但镜像在 docker.io/fluidcloudnative，集群内实测 i/o timeout。
      # 3) ack-fluid ≤ 1.0.4 不含 lookup，且镜像全部是 acs/* 由 region 拼前缀，走阿里云内网。
      #    只需下面两个 values，不需要逐组件覆盖 imagePrefix。
      ChartValues:
        # chart 默认值是占位符 __ACK_REGION_ID__（控制台安装时才会替换），编排安装必须显式传入
        region:
          Ref: ALIYUN::Region
        # 拼成 registry-vpc.<region>.aliyuncs.com/acs/...，节点无需公网即可拉取
        pullImageByVPCNetwork: true
      # 实测：ack-fluid 1.0.4 安装后约 90 秒内 dataset-controller / fluid-webhook / csi-nodeplugin 全部 Running
      WaitUntil:
        - Kind: Deployment
          Name: dataset-controller
          Namespace: fluid-system
          JsonPath: $.status.availableReplicas
          Operator: NotEmpty
          FirstMatch: true
          Timeout: 900
  # 方案基础资源：命名空间、OSS 凭证、只读输入卷（dataset / models）、Demo 所需 RBAC
  SolutionBaseApplication:
    Type: ALIYUN::CS::ClusterApplication
    DependsOn:
      - AddonReadySleep
      - OssDatasetDirectory
      - OssModelsDirectory
      # 只读卷等 OSS 预检通过再建：避开“PVC 悬在 Pending、看不到原因”的谜式失败
      - OssPreflightWaitCondition
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      DefaultNamespace: robot-demo
      # Apply 语义（类似 kubectl apply）：对象已存在时更新而不是报 409 Conflict。
      # 本栈有多个 ClusterApplication 共用 robot-demo 命名空间，且部署失败重试 /
      # 实例修改时会重复下发同一批对象，必须用 Apply 才能幂等。
      CreationMode: Apply
      # RolePolicy 保持默认 EnsureAdminRoleAndBinding（实测结论，勿改成 None）：
      # ROS 会为部署身份创建 ros:application-admin ClusterRole/Binding，WaitUntil 读取
      # CRD、Deployment 等集群资源全靠它。改成 None 会报 403
      # “User \"<uid>\" cannot get resource customresourcedefinitions at the cluster scope”。
      # 曾见到的 “RAM policy Forbidden for action cs:DescribeUserPermission” 不是模板问题，
      # 而是用服务商（supplier）账号去创建服务实例造成的——该 RAM 用户没有此权限；
      # 正确的部署身份是消费者账号，实测消费者账号可正常调用该接口。
      RolePolicy: EnsureAdminRoleAndBinding
      YamlContent:
        Fn::Sub:
          - |
            # 不要在此声明 Namespace：ClusterApplication 的 DefaultNamespace 已自动创建，
            # 重复声明会报 namespaces "robot-demo" already exists（409 Conflict）。
            apiVersion: v1
            kind: Secret
            metadata:
              name: oss-secret
              namespace: ${Namespace}
            type: Opaque
            stringData:
              akId: '${AkId}'
              akSecret: '${AkSecret}'
            ---
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: robot-dataset
              labels:
                alicloud-pvname: robot-dataset
            spec:
              capacity:
                storage: 100Gi
              accessModes:
                - ReadWriteMany
              persistentVolumeReclaimPolicy: Retain
              # 两个 OSS 卷用 RWX 而不是 ROX：运维控制台要把模型权重与样例视频写进来
              # （ossfs 支持写）。设成 ROX 时物料拉取脚本会 Permission denied。
              csi:
                driver: ossplugin.csi.alibabacloud.com
                volumeHandle: robot-dataset
                nodePublishSecretRef:
                  name: oss-secret
                  namespace: ${Namespace}
                volumeAttributes:
                  bucket: '${Bucket}'
                  url: '${OssEndpoint}'
                  path: /dataset/
                  otherOpts: '-o umask=022 -o max_stat_cache_size=0 -o allow_other'
            ---
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: robot-dataset
              namespace: ${Namespace}
            spec:
              accessModes:
                - ReadWriteMany
              resources:
                requests:
                  storage: 100Gi
              selector:
                matchLabels:
                  alicloud-pvname: robot-dataset
            ---
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: robot-models
              labels:
                alicloud-pvname: robot-models
            spec:
              capacity:
                storage: 100Gi
              accessModes:
                - ReadWriteMany
              persistentVolumeReclaimPolicy: Retain
              # 两个 OSS 卷用 RWX 而不是 ROX：运维控制台要把模型权重与样例视频写进来
              # （ossfs 支持写）。设成 ROX 时物料拉取脚本会 Permission denied。
              csi:
                driver: ossplugin.csi.alibabacloud.com
                volumeHandle: robot-models
                nodePublishSecretRef:
                  name: oss-secret
                  namespace: ${Namespace}
                volumeAttributes:
                  bucket: '${Bucket}'
                  url: '${OssEndpoint}'
                  path: /models/
                  otherOpts: '-o umask=022 -o max_stat_cache_size=0 -o allow_other'
            ---
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: robot-models
              namespace: ${Namespace}
            spec:
              accessModes:
                - ReadWriteMany
              resources:
                requests:
                  storage: 100Gi
              selector:
                matchLabels:
                  alicloud-pvname: robot-models
            ---
            # Argo executor 的 wait sidecar 需要 get/patch pods 才能标记步骤完成
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: argo-workflow-executor
              namespace: ${Namespace}
            rules:
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get", "patch"]
              - apiGroups: [""]
                resources: ["pods/log", "configmaps"]
                verbs: ["get", "list", "watch"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: argo-workflow-executor
              namespace: ${Namespace}
            subjects:
              - kind: ServiceAccount
                name: default
                namespace: ${Namespace}
            roleRef:
              kind: Role
              name: argo-workflow-executor
              apiGroup: rbac.authorization.k8s.io
            ---
            # Argo 通过 resource 模板创建 RayJob，需要 ray.io 的操作权限。
            # 用 Role（非 ClusterRole）：RayJob/RayCluster/workflowtaskresults 都在本命名空间，
            # Argo controller 也已用 workflowNamespaces 限定 robot-demo，故命名空间级足够。
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: robot-demo-rayjob
              namespace: ${Namespace}
            rules:
              - apiGroups: ["ray.io"]
                resources: ["rayjobs", "rayjobs/status", "rayclusters", "rayclusters/status"]
                verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
              # Argo 3.5+ executor 上报节点结果的首选通道；缺失时会降级到已废弃的
              # legacy pod patch 并持续刷 warning
              - apiGroups: ["argoproj.io"]
                resources: ["workflowtaskresults"]
                verbs: ["create", "patch"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: robot-demo-rayjob
              namespace: ${Namespace}
            subjects:
              - kind: ServiceAccount
                name: default
                namespace: ${Namespace}
            roleRef:
              kind: Role
              name: robot-demo-rayjob
              apiGroup: rbac.authorization.k8s.io
          - Namespace: robot-demo
            # Bucket 与 AK 都按选项解析：新建/已有 Bucket、自动新建/自备 AK
            Bucket:
              Fn::If:
                - CreateNewOSSCondition
                - Fn::GetAtt:
                    - OssBucket
                    - Name
                - Ref: ExistingOSSBucket
            AkId:
              Fn::If:
                - CreateNewRamCondition
                - Fn::GetAtt:
                    - OssAccessKey
                    - AccessKeyId
                - Ref: AccessKeyId
            AkSecret:
              Fn::If:
                - CreateNewRamCondition
                - Fn::GetAtt:
                    - OssAccessKey
                    - AccessKeySecret
                - Ref: AccessKeySecret
            OssEndpoint:
              Fn::Sub: 'oss-${ALIYUN::Region}-internal.aliyuncs.com'
  # 共享读写输出卷：CPFS 通用版走 NFS 协议服务，CPFS 智算版走 bmcpfs VPC 挂载
  SharedOutputVolumeApplication:
    Type: ALIYUN::CS::ClusterApplication
    DependsOn:
      - SolutionBaseApplication
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      DefaultNamespace: robot-demo
      CreationMode: Apply
      # RolePolicy 保持默认 EnsureAdminRoleAndBinding（实测结论，勿改成 None）：
      # ROS 会为部署身份创建 ros:application-admin ClusterRole/Binding，WaitUntil 读取
      # CRD、Deployment 等集群资源全靠它。改成 None 会报 403
      # “User \"<uid>\" cannot get resource customresourcedefinitions at the cluster scope”。
      # 曾见到的 “RAM policy Forbidden for action cs:DescribeUserPermission” 不是模板问题，
      # 而是用服务商（supplier）账号去创建服务实例造成的——该 RAM 用户没有此权限；
      # 正确的部署身份是消费者账号，实测消费者账号可正常调用该接口。
      RolePolicy: EnsureAdminRoleAndBinding
      YamlContent:
        Fn::Sub:
          - |
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: robot-output
              labels:
                alicloud-pvname: robot-output
            spec:
              capacity:
                storage: 100Gi
              accessModes:
                - ReadWriteMany
              persistentVolumeReclaimPolicy: Retain
              csi:
                driver: nasplugin.csi.alibabacloud.com
                volumeHandle: robot-output
                volumeAttributes:
                  server: '${MountDomain}'
                  path: /
              mountOptions:
                - nolock,tcp,noresvport
                - vers=3
            ---
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: robot-output
              namespace: robot-demo
            spec:
              accessModes:
                - ReadWriteMany
              resources:
                requests:
                  storage: 100Gi
              selector:
                matchLabels:
                  alicloud-pvname: robot-output
          - MountDomain:
              Fn::GetAtt:
                - NasMountTarget
                - MountTargetDomain
  # Demo 清单以 ConfigMap 形式下发，不自动提交：
  # 两个 Demo 都需要 GPU 节点在位，且 VLA 流水线还需要先上传模型权重与视频数据。
  # Demo 清单只下发 ConfigMap 与 RBAC，不会自动提交任务，因此始终下发
  # 数据工作台：vla-ops 运维控制台 + 物料脚本 + Demo 清单 + 流水线 Python 脚本，合并为一个 Application。
  # 脚本以 ConfigMap vla-pipeline-script 内嵌下发，用户无需再手动 git clone + create cm（原第 3 步已消除）。
  # 三个 Demo 变量（镜像/副本数/拉取密钥行）均为常量，已直接硬编码，故无需 Fn::Sub；
  # 这样也让 prepare-data.sh 里的 shell $ 变量不会被 Fn::Sub 误替换。
  VlaWorkbenchApplication:
    Type: ALIYUN::CS::ClusterApplication
    DependsOn:
      - SolutionBaseApplication
      - SharedOutputVolumeApplication
    Properties:
      ClusterId:
        Fn::GetAtt:
          - AckCluster
          - ClusterId
      DefaultNamespace: robot-demo
      CreationMode: Apply
      # RolePolicy 保持 EnsureAdminRoleAndBinding（勿改 None，否则 WaitUntil 读集群资源报 403）
      RolePolicy: EnsureAdminRoleAndBinding
      YamlContent: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: vla-ops
          namespace: robot-demo
        ---
        # 控制台自身权限：提交/清理 Workflow + 只读排查，不含集群级写权限
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: vla-ops
          namespace: robot-demo
        rules:
          - apiGroups: ["argoproj.io"]
            resources: ["workflows", "workflowtemplates"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["ray.io"]
            resources: ["rayjobs", "rayclusters"]
            verbs: ["get", "list", "watch", "delete"]
          - apiGroups: [""]
            resources: ["pods", "pods/log", "persistentvolumeclaims", "configmaps", "events", "services"]
            verbs: ["get", "list", "watch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: vla-ops
          namespace: robot-demo
        subjects:
          - kind: ServiceAccount
            name: vla-ops
            namespace: robot-demo
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: vla-ops
        ---
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: vla-materials
          namespace: robot-demo
        data:
          prepare-data.sh: |
            #!/bin/bash
            # 拉取 VLA 流水线物料（模型权重 + 样例视频）并校验。
            # 物料托管在计算巢公开 bucket computenest-artifacts-<region>/embodied-ai/，
            # 已验证 cn-beijing / cn-shanghai / cn-hangzhou 均有镜像。
            # 用法: bash /materials/prepare-data.sh [--check-only] [--public] [--region <r>]
            set -uo pipefail
            CHECK_ONLY=0; USE_PUBLIC=0; REGION=""
            while [ $# -gt 0 ]; do
              case "$1" in
                --check-only) CHECK_ONLY=1; shift ;;
                --public)     USE_PUBLIC=1; shift ;;
                --region)     REGION="$2"; shift 2 ;;
                *) echo "未知参数: $1"; exit 2 ;;
              esac
            done
            # 地域：未指定时从 ECS 元数据服务探测，探不到回退 cn-hangzhou
            if [ -z "$REGION" ]; then
              REGION=$(curl -s --max-time 3 http://100.100.100.200/latest/meta-data/region-id || true)
              [ -z "$REGION" ] && REGION=cn-hangzhou
            fi
            if [ "$USE_PUBLIC" = "1" ]; then
              OSS_HOST="computenest-artifacts-$REGION.oss-$REGION.aliyuncs.com"
            else
              OSS_HOST="computenest-artifacts-$REGION.oss-$REGION-internal.aliyuncs.com"
            fi
            OSS_BASE="https://$OSS_HOST/embodied-ai"
            MODELS_DIR=/data/models
            DATASET_DIR=/data/dataset
            echo "============================================================="
            echo " VLA 物料准备 | 地域=$REGION | 端点=$OSS_HOST"
            [ "$CHECK_ONLY" = "1" ] && echo " 模式: CHECK-ONLY（只校验不下载）"
            echo "============================================================="
            fetch() {
              name="$1"; size="$2"; root="$3"; probe="$4"
              if [ -f "$root/$probe" ]; then
                echo "  ⏭  $name 已存在，跳过"
                return 0
              fi
              if [ "$CHECK_ONLY" = "1" ]; then
                echo "  ❌ $name 缺失（check-only 不下载）"
                return 1
              fi
              echo "  ⬇  $name（$size）流式解包到 $root ..."
              mkdir -p "$root"
              if curl -fL --retry 3 --retry-delay 5 "$OSS_BASE/$name" | tar -xzf - -C "$root"; then
                echo "  ✔ $name 完成"
                return 0
              fi
              echo "  ❌ $name 下载或解包失败"
              return 1
            }
            FAIL=0
            echo "▶ 拉取物料"
            fetch hawor.tar.gz   3.1GB "$MODELS_DIR"  hawor/hawor.ckpt                              || FAIL=1
            fetch mano.tar.gz    165MB "$MODELS_DIR"  mano/MANO_RIGHT.pkl                           || FAIL=1
            fetch dataset.tar.gz 12MB  "$DATASET_DIR" ego_hand_action_annotation/data/1018.mp4      || FAIL=1
            echo
            echo "▶ 校验最终布局"
            OK=0; MISS=0
            for f in "$MODELS_DIR/hawor/hawor.ckpt" "$MODELS_DIR/hawor/model_config.yaml" \
                     "$MODELS_DIR/hawor/detector.pt" "$MODELS_DIR/mano/MANO_RIGHT.pkl" \
                     "$MODELS_DIR/mano/MANO_LEFT.pkl" \
                     "$DATASET_DIR/ego_hand_action_annotation/data/1018.mp4"; do
              printf '  %-58s ' "$(basename $f)"
              if [ -f "$f" ]; then
                echo "✅ $(du -h $f 2>/dev/null | cut -f1)"
                OK=$((OK+1))
              else
                echo "❌ 缺失"
                MISS=$((MISS+1))
              fi
            done
            echo
            echo " 结果：就位 $OK | 缺失 $MISS"
            if [ "$MISS" -gt 0 ] || [ "$FAIL" = "1" ]; then
              echo " ❗ 物料不齐。内网端点不通时试 --public；地域不对时试 --region <集群地域>。"
              exit 1
            fi
            echo " ✅ 物料齐全，可以提交流水线了："
            echo "     kubectl -n robot-demo get cm demo-manifests -o jsonpath='{.data.02-vla-pipeline\.yaml}' | kubectl apply -f -"
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: vla-ops
          namespace: robot-demo
          labels: { app: vla-ops }
        spec:
          replicas: 1
          strategy:
            type: Recreate          # 独占 PVC，避开滚动更新时两个副本同时挂载
          selector:
            matchLabels: { app: vla-ops }
          template:
            metadata:
              labels: { app: vla-ops }
            spec:
              serviceAccountName: vla-ops
              containers:
                - name: ops
                  # 该公开镜像已内置 kubectl + ossutil
                  image: compute-nest-registry.cn-hangzhou.cr.aliyuncs.com/public/ossutil:2.0
                  imagePullPolicy: IfNotPresent
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      echo "============================================="
                      echo " VLA 运维控制台就绪"
                      echo " 挂载点  : /data/models  /data/dataset  /data/output"
                      echo " 物料脚本: /materials/prepare-data.sh"
                      echo "============================================="
                      echo " 进入: kubectl exec -it deploy/vla-ops -n robot-demo -- bash"
                      echo " 备料: bash /materials/prepare-data.sh"
                      echo "============================================="
                      sleep infinity
                  resources:
                    requests: { cpu: "500m", memory: "1Gi" }
                    limits: { cpu: "4", memory: "8Gi" }   # 解包 3GB tar 需要余量
                  volumeMounts:
                    - { name: models,    mountPath: /data/models }
                    - { name: dataset,   mountPath: /data/dataset }
                    - { name: output,    mountPath: /data/output }
                    - { name: materials, mountPath: /materials, readOnly: true }
                    - { name: scripts,   mountPath: /scripts, readOnly: true }
                    - { name: demos,     mountPath: /demo-manifests, readOnly: true }
              volumes:
                - name: models
                  persistentVolumeClaim: { claimName: robot-models }
                - name: dataset
                  persistentVolumeClaim: { claimName: robot-dataset }
                - name: output
                  persistentVolumeClaim: { claimName: robot-output }
                - name: materials
                  configMap:
                    name: vla-materials
                    defaultMode: 0755
                - name: scripts
                  configMap: { name: vla-pipeline-script }
                - name: demos
                  configMap: { name: demo-manifests }
        ---
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: demo-manifests
          namespace: robot-demo
        data:
          01-gpu-check.yaml: |
            # Demo A：GPU 环境自检（单 Pod）
            apiVersion: v1
            kind: Pod
            metadata:
              name: gpu-check
              namespace: robot-demo
            spec:
              restartPolicy: Never
              imagePullSecrets: []
              tolerations:
                - key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: check
                  image: compute-nest-registry.cn-hangzhou.cr.aliyuncs.com/public/vla-pipeline:torch2.7.0-cu128-20260729
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      echo "===== nvidia-smi ====="; nvidia-smi || true
                      echo "===== torch ====="; python -c "import torch;print('torch',torch.__version__,'cuda',torch.cuda.is_available(),'count',torch.cuda.device_count())" || true
                      echo "===== data_juicer ops ====="; python -c "from data_juicer.ops.mapper import VideoExtractFramesMapper, ExportToLeRobotMapper; print('data_juicer ops import OK')" || true
                      echo "===== mounted volumes ====="; ls /data/dataset /data/models 2>&1 || true
                  resources:
                    limits:
                      nvidia.com/gpu: "1"
                    requests:
                      nvidia.com/gpu: "1"
                  volumeMounts:
                    - { name: dataset, mountPath: /data/dataset }
                    - { name: models, mountPath: /data/models }
              # 只挂载恒存在的两个只读卷；robot-output 仅当共享存储不为 None 时存在，由 Demo B 使用
              volumes:
                - name: dataset
                  persistentVolumeClaim: { claimName: robot-dataset }
                - name: models
                  persistentVolumeClaim: { claimName: robot-models }
          02-vla-argo-workflow.yaml: |
            # Demo B：两阶段 VLA 数据流水线（Argo DAG：GPU RayJob -> CPU 后处理）
            # 提交前请先创建脚本 ConfigMap：
            #   kubectl -n robot-demo create cm vla-pipeline-script \
            #     --from-file=demo/vla_gpu_pipeline.py \
            #     --from-file=demo/vla_cpu_postprocess.py
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: vla-pipeline-
              namespace: robot-demo
            spec:
              entrypoint: vla-dag
              serviceAccountName: default
              imagePullSecrets: []
              volumes:
                - name: dataset
                  persistentVolumeClaim: { claimName: robot-dataset }
                - name: models
                  persistentVolumeClaim: { claimName: robot-models }
                - name: output
                  persistentVolumeClaim: { claimName: robot-output }
                - name: scripts
                  configMap: { name: vla-pipeline-script }
              templates:
                - name: vla-dag
                  dag:
                    tasks:
                      - name: gpu-pipeline
                        template: gpu-pipeline-rayjob
                      - name: cpu-postprocess
                        template: cpu-postprocess-pod
                        dependencies: [gpu-pipeline]
                - name: gpu-pipeline-rayjob
                  resource:
                    action: create
                    # 实测必需：不设时删掉 Workflow 不会回收 RayJob/RayCluster，GPU 一直被占
                    setOwnerReference: true
                    successCondition: status.jobDeploymentStatus == Complete
                    failureCondition: status.jobDeploymentStatus == Failed
                    manifest: |
                      apiVersion: ray.io/v1
                      kind: RayJob
                      metadata:
                        # 实测必需：固定名字会让第二次提交报
                        # "rayjobs.ray.io \"xxx\" already exists"，跟随 Workflow 名即可
                        name: '{{workflow.name}}-rayjob'
                        namespace: robot-demo
                      spec:
                        shutdownAfterJobFinishes: true
                        activeDeadlineSeconds: 7200
                        entrypoint: "python /scripts/vla_gpu_pipeline.py"
                        runtimeEnvYAML: >-
                          {"env_vars":{"HF_ENDPOINT":"https://hf-mirror.com","PYTHONUNBUFFERED":"1"}}
                        submitterPodTemplate:
                          spec:
                            restartPolicy: Never
                            imagePullSecrets: []
                            containers:
                              - name: ray-job-submitter
                                image: compute-nest-registry.cn-hangzhou.cr.aliyuncs.com/public/vla-pipeline:torch2.7.0-cu128-20260729
                                resources:
                                  limits: { cpu: "1", memory: "2Gi" }
                        rayClusterSpec:
                          rayVersion: "2.40.0"
                          headGroupSpec:
                            rayStartParams:
                              dashboard-host: "0.0.0.0"
                              # head 无卡，显式钉死 0：否则 Ray 会自动探测并上报“幻影 GPU”，
                              # 导致 GPU actor 被调度到无卡的 head 上而永远跑不起来
                              num-gpus: "0"
                            template:
                              spec:
                                imagePullSecrets: []
                                containers:
                                  - name: ray-head
                                    image: compute-nest-registry.cn-hangzhou.cr.aliyuncs.com/public/vla-pipeline:torch2.7.0-cu128-20260729
                                    env:
                                      - { name: PYTHONUNBUFFERED, value: "1" }
                                      # 与上方 num-gpus=0 双保险：置空可见设备，断掉 Ray 自动探测的幻影 GPU
                                      - { name: CUDA_VISIBLE_DEVICES, value: "" }
                                    resources:
                                      # 实测必需：requests 不能超过管控节点的**整机可分配量**。
                                      # 默认管控规格 4c16g 实际可分配约 3920m/14.7Gi，若 requests 写 4c16g
                                      # 则 head 永远 Pending（且 Workflow 一直显示 Running、不报错，极难发现）。
                                      limits: { cpu: "4", memory: "16Gi" }
                                      requests: { cpu: "2", memory: "8Gi" }
                                    volumeMounts:
                                      - { name: models, mountPath: /data/models }
                                      - { name: dataset, mountPath: /data/dataset }
                                      - { name: output, mountPath: /data/output }
                                      - { name: scripts, mountPath: /scripts }
                                volumes:
                                  - name: models
                                    persistentVolumeClaim: { claimName: robot-models }
                                  - name: dataset
                                    persistentVolumeClaim: { claimName: robot-dataset }
                                  - name: output
                                    persistentVolumeClaim: { claimName: robot-output }
                                  - name: scripts
                                    configMap: { name: vla-pipeline-script }
                          workerGroupSpecs:
                            - groupName: gpu-worker
                              replicas: 1
                              minReplicas: 1
                              maxReplicas: 1
                              rayStartParams: {}
                              template:
                                spec:
                                  imagePullSecrets: []
                                  tolerations:
                                    - key: nvidia.com/gpu
                                      operator: Exists
                                      effect: NoSchedule
                                  containers:
                                    - name: ray-worker
                                      image: compute-nest-registry.cn-hangzhou.cr.aliyuncs.com/public/vla-pipeline:torch2.7.0-cu128-20260729
                                      env:
                                        - { name: HF_ENDPOINT, value: "https://hf-mirror.com" }
                                        - { name: PYTHONUNBUFFERED, value: "1" }
                                      resources:
                                        # GPU worker 跑在 GPU 节点上（默认 gn8is.4xlarge = 16c128g，
                                        # 可分配约 15890m），limits 16c 会超过可分配量，因此封顶 12c
                                        limits:
                                          nvidia.com/gpu: "1"
                                          cpu: "12"
                                          memory: "64Gi"
                                        requests:
                                          nvidia.com/gpu: "1"
                                          cpu: "4"
                                          memory: "16Gi"
                                      volumeMounts:
                                        - { name: models, mountPath: /data/models }
                                        - { name: dataset, mountPath: /data/dataset }
                                        - { name: output, mountPath: /data/output }
                                        - { name: scripts, mountPath: /scripts }
                                  volumes:
                                    - name: models
                                      persistentVolumeClaim: { claimName: robot-models }
                                    - name: dataset
                                      persistentVolumeClaim: { claimName: robot-dataset }
                                    - name: output
                                      persistentVolumeClaim: { claimName: robot-output }
                                    - name: scripts
                                      configMap: { name: vla-pipeline-script }
                - name: cpu-postprocess-pod
                  container:
                    image: compute-nest-registry.cn-hangzhou.cr.aliyuncs.com/public/vla-pipeline:torch2.7.0-cu128-20260729
                    command: ["python", "/scripts/vla_cpu_postprocess.py"]
                    env:
                      - { name: PYTHONUNBUFFERED, value: "1" }
                    resources:
                      # 同 head：requests 不能超过管控节点整机可分配量（4c16g 规格约 3920m/14.7Gi），
                      # 否则后处理 Pod 一直 Pending
                      limits: { cpu: "8", memory: "16Gi" }
                      requests: { cpu: "2", memory: "8Gi" }
                    volumeMounts:
                      - { name: output, mountPath: /data/output }
                      - { name: dataset, mountPath: /data/dataset }
                      - { name: scripts, mountPath: /scripts }
        ---
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: vla-pipeline-script
          namespace: robot-demo
        data:
          vla_gpu_pipeline.py: |
            """VLA GPU Pipeline — Argo Workflow + RayJob 的 GPU 阶段。

            五个 Stage 在 Ray Data 上流式执行：
                帧提取 (CPU) -> MoGe-2 相机标定 (GPU) -> HaWoR + MegaSaM (GPU)
                -> 手部动作计算 (CPU) -> LeRobot v2.0 导出 (CPU)

            与原始单机脚本的差异：
              * 视频列表从挂载的数据集目录扫描得到，不再硬编码；
              * GPU Actor 数量按集群实际 GPU 卡数自动放大，用于整机并行；
              * 输出目录、模型目录、并行度均可通过环境变量覆盖。

            环境变量：
              VLA_DATASET_DIR   输入视频目录，默认 /data/dataset
              VLA_OUTPUT_DIR    输出目录，默认 /data/output/vla-gpu-pipeline
              VLA_MODEL_DIR     模型根目录，默认 /data/models
              VLA_MAX_VIDEOS    最多处理多少个视频，默认 0（不限制）
              VLA_GPU_ACTORS    GPU Actor 数量，默认取集群 GPU 卡数
              VLA_FRAME_NUM     每个视频抽帧数，默认 20（MegaSaM 至少需要 8 帧）
              VLA_SLIM_OUTPUT   置 1 时落盘前裁剪大字段，规模化时显著降低 I/O
            """
            import glob
            import os
            import time

            import ray
            from ray.data import ActorPoolStrategy, DataContext

            from data_juicer.utils.constant import Fields, MetaKeys
            from data_juicer.ops.base_op import OPERATORS, Mapper
            from data_juicer.ops.mapper import (
                VideoExtractFramesMapper,
                VideoCameraCalibrationMogeMapper,
                VideoHandReconstructionHaworMapper,
                VideoCameraPoseMegaSaMMapper,
                VideoHandActionComputeMapper,
                ExportToLeRobotMapper,
            )

            DATASET_DIR = os.environ.get("VLA_DATASET_DIR", "/data/dataset")
            OUTPUT_DIR = os.environ.get("VLA_OUTPUT_DIR", "/data/output/vla-gpu-pipeline")
            MODEL_ROOT = os.environ.get("VLA_MODEL_DIR", "/data/models")
            MAX_VIDEOS = int(os.environ.get("VLA_MAX_VIDEOS", "0"))
            FRAME_NUM = int(os.environ.get("VLA_FRAME_NUM", "20"))
            SLIM_OUTPUT = os.environ.get("VLA_SLIM_OUTPUT", "0") == "1"

            HAWOR_DIR = os.path.join(MODEL_ROOT, "hawor")
            MANO_DIR = os.path.join(MODEL_ROOT, "mano")
            VIDEO_KEY = "videos"

            print("=== VLA GPU Pipeline (Argo + RayCluster) ===", flush=True)


            @OPERATORS.register_module("video_hawor_megasam_combined_mapper")
            class VideoHaWorMegaSaMCombinedMapper(Mapper):
                """把 HaWoR 与 MegaSaM 合并到同一个 GPU Actor，共享 GPU 上下文。

                MegaSaM（DROID-SLAM）失败时通过 try/except 保留 HaWoR 的手部重建结果，
                不让已完成的 GPU 计算白跑。
                """

                _accelerator = "cuda"

                def __init__(
                    self,
                    hawor_model_path="hawor.ckpt",
                    hawor_config_path="model_config.yaml",
                    hawor_detector_path="detector.pt",
                    mano_right_path="MANO_RIGHT.pkl",
                    mano_left_path="MANO_LEFT.pkl",
                    camera_calibration_field=MetaKeys.camera_calibration_moge_tags,
                    hawor_tag_field=MetaKeys.hand_reconstruction_hawor_tags,
                    frame_field=MetaKeys.video_frames,
                    hawor_thresh=0.2,
                    megasam_tag_field=MetaKeys.video_camera_pose_tags,
                    megasam_max_frames=1000,
                    megasam_droid_buffer=1024,
                    megasam_save_dir=None,
                    *args,
                    **kwargs,
                ):
                    super().__init__(*args, **kwargs)
                    self._hawor_kwargs = dict(
                        hawor_model_path=hawor_model_path,
                        hawor_config_path=hawor_config_path,
                        hawor_detector_path=hawor_detector_path,
                        mano_right_path=mano_right_path,
                        mano_left_path=mano_left_path,
                        camera_calibration_field=camera_calibration_field,
                        tag_field_name=hawor_tag_field,
                        frame_field=frame_field,
                        thresh=hawor_thresh,
                        batch_mode=True,
                        skip_op_error=kwargs.get("skip_op_error", False),
                    )
                    self._megasam_kwargs = dict(
                        tag_field_name=megasam_tag_field,
                        camera_calibration_field=camera_calibration_field,
                        frame_field=frame_field,
                        max_frames=megasam_max_frames,
                        droid_buffer=megasam_droid_buffer,
                        save_dir=megasam_save_dir,
                        batch_mode=True,
                        skip_op_error=kwargs.get("skip_op_error", False),
                    )
                    self._hawor_op = None
                    self._megasam_op = None

                def _ensure_ops(self):
                    if self._hawor_op is None:
                        self._hawor_op = VideoHandReconstructionHaworMapper(**self._hawor_kwargs)
                    if self._megasam_op is None:
                        self._megasam_op = VideoCameraPoseMegaSaMMapper(**self._megasam_kwargs)

                def process_single(self, sample=None, rank=None):
                    from loguru import logger as _logger

                    self._ensure_ops()
                    t0 = time.time()
                    sample = self._hawor_op.process_single(sample, rank=rank)
                    t1 = time.time()
                    _logger.info(f"HaWoR completed in {t1 - t0:.1f}s")
                    try:
                        sample = self._megasam_op.process_single(sample, rank=rank)
                        _logger.info(f"MegaSaM completed in {time.time() - t1:.1f}s")
                    except Exception as e:  # noqa: BLE001 - 保留 HaWoR 结果优先于中断整条流水线
                        _logger.error(f"MegaSaM failed (HaWoR preserved): {e}")
                        megasam_field = self._megasam_kwargs.get(
                            "tag_field_name", MetaKeys.video_camera_pose_tags
                        )
                        if Fields.meta not in sample:
                            sample[Fields.meta] = {}
                        n = len(
                            sample.get(
                                self._hawor_kwargs.get("frame_field", MetaKeys.video_frames), []
                            )
                        )
                        sample[Fields.meta][megasam_field] = [
                            {"cam_c2w": [], "cam_w2c": []} for _ in range(max(1, n))
                        ]
                    return sample


            def discover_videos():
                patterns = ("**/*.mp4", "**/*.MP4", "**/*.mov")
                paths = []
                for p in patterns:
                    paths.extend(glob.glob(os.path.join(DATASET_DIR, p), recursive=True))
                paths = sorted(set(paths))
                if MAX_VIDEOS > 0:
                    paths = paths[:MAX_VIDEOS]
                return paths


            def main():
                DataContext.get_current().enable_fallback_to_arrow_object_ext_type = True
                ray.init(address="auto")
                resources = ray.cluster_resources()
                print(f"Ray cluster resources: {resources}", flush=True)

                gpu_actors = int(os.environ.get("VLA_GPU_ACTORS", "0")) or max(
                    1, int(resources.get("GPU", 1))
                )
                print(f"GPU actors: {gpu_actors}", flush=True)

                lerobot_output_dir = os.path.join(OUTPUT_DIR, "lerobot_dataset")
                os.makedirs(OUTPUT_DIR, exist_ok=True)

                videos = discover_videos()
                if not videos:
                    raise SystemExit(
                        f"No video found under {DATASET_DIR}. "
                        "Upload the source videos to oss://<bucket>/dataset/ first."
                    )
                print(f"Processing {len(videos)} videos with {gpu_actors} GPU actors", flush=True)

                samples = [{VIDEO_KEY: [p], "text": "", Fields.meta: {}} for p in videos]
                ds = ray.data.from_items(samples)
                s_time = time.time()

                # Stage 1: 帧提取（CPU）。frame_num 必须 >= 8，否则 MegaSaM 无法完成 Bundle Adjustment
                ds = ds.map_batches(
                    VideoExtractFramesMapper,
                    fn_constructor_kwargs=dict(
                        frame_sampling_method="uniform",
                        frame_num=FRAME_NUM,
                        video_backend="ffmpeg",
                        output_format="path",
                        frame_dir=os.path.join(OUTPUT_DIR, "frames"),
                        frame_field=MetaKeys.video_frames,
                        legacy_split_by_text_token=False,
                        batch_mode=True,
                        video_key=VIDEO_KEY,
                    ),
                    batch_size=1,
                    num_cpus=1,
                    batch_format="pyarrow",
                )

                # Stage 2: 相机标定 MoGe-2（GPU）。depth map 是整条流水线最大的中间产物
                ds = ds.map_batches(
                    VideoCameraCalibrationMogeMapper,
                    fn_constructor_kwargs=dict(
                        model_path="Ruicheng/moge-2-vitl",
                        tag_field_name=MetaKeys.camera_calibration_moge_tags,
                        frame_field=MetaKeys.video_frames,
                        output_depth=True,
                        output_points=False,
                        output_mask=False,
                        output_intrinsics=True,
                        output_hfov=True,
                        save_dir=os.path.join(OUTPUT_DIR, "moge_arrays"),
                        batch_mode=True,
                    ),
                    batch_size=1,
                    num_gpus=0.5,
                    batch_format="pyarrow",
                    compute=ActorPoolStrategy(min_size=1, max_size=gpu_actors),
                )

                # Stage 3: HaWoR + MegaSaM（GPU，合并 Actor）。MegaSaM 占整体耗时约 8 成
                ds = ds.map_batches(
                    VideoHaWorMegaSaMCombinedMapper,
                    fn_constructor_kwargs=dict(
                        camera_calibration_field=MetaKeys.camera_calibration_moge_tags,
                        hawor_tag_field=MetaKeys.hand_reconstruction_hawor_tags,
                        megasam_tag_field=MetaKeys.video_camera_pose_tags,
                        hawor_model_path=os.path.join(HAWOR_DIR, "hawor.ckpt"),
                        hawor_config_path=os.path.join(HAWOR_DIR, "model_config.yaml"),
                        hawor_detector_path=os.path.join(HAWOR_DIR, "detector.pt"),
                        mano_right_path=os.path.join(MANO_DIR, "MANO_RIGHT.pkl"),
                        mano_left_path=os.path.join(MANO_DIR, "MANO_LEFT.pkl"),
                        frame_field=MetaKeys.video_frames,
                        megasam_max_frames=1000,
                        megasam_save_dir=os.path.join(OUTPUT_DIR, "megasam_arrays"),
                        batch_mode=True,
                        skip_op_error=False,
                    ),
                    batch_size=1,
                    num_gpus=0.5,
                    batch_format="pyarrow",
                    compute=ActorPoolStrategy(min_size=1, max_size=gpu_actors),
                )

                # Stage 4: 手部动作计算（CPU）。依赖 Stage 2-3 的 Arrow 嵌套 struct，因此留在 GPU 阶段
                ds = ds.map_batches(
                    VideoHandActionComputeMapper,
                    fn_constructor_kwargs=dict(
                        hand_reconstruction_field=MetaKeys.hand_reconstruction_hawor_tags,
                        camera_pose_field=MetaKeys.video_camera_pose_tags,
                        tag_field_name=MetaKeys.hand_action_tags,
                        hand_type="both",
                        batch_mode=True,
                    ),
                    batch_size=1,
                    num_cpus=1,
                    batch_format="pyarrow",
                )

                # Stage 5: 导出 LeRobot v2.0（CPU，中间产物）
                ds = ds.map_batches(
                    ExportToLeRobotMapper,
                    fn_constructor_kwargs=dict(
                        output_dir=lerobot_output_dir,
                        hand_action_field=MetaKeys.hand_action_tags,
                        frame_field=MetaKeys.video_frames,
                        video_key=VIDEO_KEY,
                        fps=10,
                        robot_type="egodex_hand",
                        batch_mode=True,
                    ),
                    batch_size=1,
                    num_cpus=1,
                    batch_format="pyarrow",
                )

                if SLIM_OUTPUT:
                    # 落盘前裁掉 CPU 阶段不需要的大字段（depth map / MANO 原始参数 / c2w 矩阵），
                    # 规模化时可把落盘量从数十 MB/2 视频降到约 1 MB/2 视频
                    columns = [c for c in ("video_frames", "hand_action_tags", "videos") if c in ds.columns()]
                    print(f"Slim output enabled, keeping columns: {columns}", flush=True)
                    ds = ds.select_columns(columns)

                ds.write_json(OUTPUT_DIR, force_ascii=False)
                ExportToLeRobotMapper.finalize_dataset(
                    output_dir=lerobot_output_dir, fps=10, robot_type="egodex_hand"
                )

                total = time.time() - s_time
                print(f"GPU Pipeline COMPLETE: {total:.1f}s ({total / 60:.1f}min)", flush=True)
                print(f"LeRobot output: {lerobot_output_dir}", flush=True)


            if __name__ == "__main__":
                main()
          vla_cpu_postprocess.py: |
            """VLA CPU 后处理 — Argo Workflow 的第二阶段（普通 Pod，不需要 GPU）。

            读取 GPU 阶段落盘的 *.json，执行：
                轨迹平滑 (Savitzky-Golay) -> 原子动作分割 -> LeRobot v2.0 最终导出

            环境变量：
              VLA_INPUT_DIR   GPU 阶段输出目录，默认 /data/output/vla-gpu-pipeline
              VLA_OUTPUT_DIR  本阶段输出目录，默认 /data/output/vla-cpu-postprocess
            """
            import glob
            import os
            import time

            import ray
            from ray.data import DataContext

            from data_juicer.utils.constant import MetaKeys
            from data_juicer.ops.mapper import (
                VideoHandMotionSmoothMapper,
                VideoAtomicActionSegmentMapper,
                ExportToLeRobotMapper,
            )

            INPUT_DIR = os.environ.get("VLA_INPUT_DIR", "/data/output/vla-gpu-pipeline")
            OUTPUT_DIR = os.environ.get("VLA_OUTPUT_DIR", "/data/output/vla-cpu-postprocess")


            def main():
                print("=== VLA CPU Post-Processing (Argo Step 2) ===", flush=True)
                DataContext.get_current().enable_fallback_to_arrow_object_ext_type = True
                ray.init()

                lerobot_dir = os.path.join(OUTPUT_DIR, "lerobot_dataset_smoothed")
                os.makedirs(OUTPUT_DIR, exist_ok=True)
                s_time = time.time()

                # 只匹配顶层 JSON，避免递归读到 lerobot_dataset/meta/ 下的元数据文件
                json_files = sorted(glob.glob(os.path.join(INPUT_DIR, "*.json")))
                if not json_files:
                    raise SystemExit(f"No *.json found under {INPUT_DIR}; did the GPU stage finish?")

                ds = ray.data.read_json(json_files)
                print(f"Read {ds.count()} records from GPU pipeline output", flush=True)

                ds = ds.map_batches(
                    VideoHandMotionSmoothMapper,
                    fn_constructor_kwargs=dict(
                        hand_action_field=MetaKeys.hand_action_tags,
                        savgol_window=11,
                        savgol_polyorder=3,
                        outlier_velocity_threshold=5.0,
                        smooth_joints=True,
                        batch_mode=True,
                    ),
                    batch_size=1,
                    num_cpus=1,
                    batch_format="pyarrow",
                )
                ds = ds.map_batches(
                    VideoAtomicActionSegmentMapper,
                    fn_constructor_kwargs=dict(
                        hand_action_field=MetaKeys.hand_action_tags,
                        segment_field="atomic_action_segments",
                        min_segment_frames=8,
                        max_segment_frames=300,
                        hand_type="both",
                        batch_mode=True,
                    ),
                    batch_size=1,
                    num_cpus=1,
                    batch_format="pyarrow",
                )
                ds = ds.map_batches(
                    ExportToLeRobotMapper,
                    fn_constructor_kwargs=dict(
                        output_dir=lerobot_dir,
                        hand_action_field=MetaKeys.hand_action_tags,
                        segment_field="atomic_action_segments",
                        frame_field=MetaKeys.video_frames,
                        fps=10,
                        robot_type="egodex_hand",
                        batch_mode=True,
                    ),
                    batch_size=1,
                    num_cpus=1,
                    batch_format="pyarrow",
                )

                ds.write_json(OUTPUT_DIR, force_ascii=False)
                ExportToLeRobotMapper.finalize_dataset(
                    output_dir=lerobot_dir, fps=10, robot_type="egodex_hand"
                )

                print(f"CPU Post-Processing COMPLETE: {time.time() - s_time:.1f}s", flush=True)
                print(f"LeRobot smoothed dataset: {lerobot_dir}", flush=True)


            if __name__ == "__main__":
                main()

